<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-16%20-16%2032%2032%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22hib%22%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2215%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235d3a55%22/%3E%3Cstop%20offset%3D%22.35%22%20stop-color%3D%22%239b5a7f%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ecb6c6%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Cg%20fill%3D%22url%28%23hib%29%22%20stroke%3D%22%2316111a%22%20stroke-width%3D%22.6%22%3E%3Cpath%20transform%3D%22rotate%280%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%2872%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28144%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28216%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28288%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3C/g%3E%3Ccircle%20r%3D%222.6%22%20fill%3D%22%234a2c45%22/%3E%3Cpath%20d%3D%22M0%200L6.5%20-8.5%22%20stroke%3D%22%23d9dba7%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22/%3E%3Cg%20fill%3D%22%23d9dba7%22%3E%3Ccircle%20cx%3D%226.8%22%20cy%3D%22-9.2%22%20r%3D%221.1%22/%3E%3Ccircle%20cx%3D%225%22%20cy%3D%22-9.6%22%20r%3D%22.8%22/%3E%3Ccircle%20cx%3D%227.9%22%20cy%3D%22-7.6%22%20r%3D%22.8%22/%3E%3Ccircle%20cx%3D%224.6%22%20cy%3D%22-7.8%22%20r%3D%22.7%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* palette: slate #554860 · mauve #9b7b8b · plum #5d3a55 · lime #d9dba7 · ivy #8ea653 · blush #d7c4bd */
  --bg:#16111a; --s1:#201925; --s2:#2a2131; --s3:#352a3e; --line:#3d3147;
  --slate:#554860; --plum:#5d3a55; --mauve:#9b7b8b; --lime:#d9dba7; --ivy:#8ea653; --blush:#d7c4bd;
  --tx:#f2eae7; --mut:#b5a5b3; --dim:#7f6f83;
  --lo:#bf96aa; --lo-bg:rgba(155,123,139,.16); --lo-bd:rgba(155,123,139,.45);
  --up:#a7c163; --up-bg:rgba(142,166,83,.14); --up-bd:rgba(142,166,83,.45);
  --full:#d9dba7; --oth:#c3b6cf;
  --ca:#e3a98c; --ca-bg:rgba(227,169,140,.13); --ca-bd:rgba(227,169,140,.42);
  --bad:#e08a8a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(22,17,26,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo-mark{width:34px;height:34px;border-radius:10px;background:#2a2131;border:1px solid var(--line);display:grid;place-items:center}
.logo h1{font-size:19px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ivy)} .dot.warn{background:var(--mauve)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.icon-btn:hover{background:var(--s2);color:var(--tx)}
main{padding:18px 0 24px}
.view-title{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px}
.view-title h2{font-size:24px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mut);margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.edit{border-color:var(--lime);color:var(--lime);background:rgba(217,219,167,.07)}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(32,25,37,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;justify-content:space-around;height:64px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--dim)}
nav.tabs button.on{color:var(--lime)}
nav.tabs svg{width:22px;height:22px}

/* log */
.top-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
input[type=date],input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--mauve)}
input[type=date]{color-scheme:dark;min-height:42px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.t-Lower{background:var(--lo-bg);color:var(--lo);box-shadow:inset 0 0 0 1px var(--lo-bd)}
.seg button.on.t-Upper{background:var(--up-bg);color:var(--up);box-shadow:inset 0 0 0 1px var(--up-bd)}
.seg button.on.t-Full{background:rgba(217,219,167,.12);color:var(--full);box-shadow:inset 0 0 0 1px rgba(217,219,167,.4)}
.seg button.on.t-Cardio{background:var(--ca-bg);color:var(--ca);box-shadow:inset 0 0 0 1px var(--ca-bd)}
.seg button.on.t-Other{background:rgba(215,196,189,.12);color:var(--oth);box-shadow:inset 0 0 0 1px rgba(215,196,189,.4)}
.grp{margin-top:18px}
.grp-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;text-align:left}
.grp-h h3{font-size:17px}
.grp-h .bar{width:4px;height:20px;border-radius:3px}
.grp-lo .bar{background:var(--lo)} .grp-up .bar{background:var(--up)} .grp-ca .bar{background:var(--ca)}
.grp-h .meta{color:var(--mut);font-size:13px;margin-left:auto}
.chev{transition:transform .2s;color:var(--dim)} .grp.closed .chev{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.cat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grp-lo .cat{border-top:2px solid var(--lo-bd)} .grp-up .cat{border-top:2px solid var(--up-bd)} .grp-ca .cat{border-top:2px solid var(--ca-bd)}
.grp-ca .chip.on{background:var(--ca-bg);border-color:var(--ca-bd);color:var(--ca)}
.cat-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-h b{font-size:14px;font-weight:600;text-transform:capitalize}
.cnt{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--s3);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:20px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.chip:hover{color:var(--tx)}
.grp-lo .chip.on{background:var(--lo-bg);border-color:var(--lo-bd);color:var(--lo)}
.grp-up .chip.on{background:var(--up-bg);border-color:var(--up-bd);color:var(--up)}
.chip.new{border-style:dashed;color:var(--dim)}
.newex{display:flex;gap:8px;margin-top:10px}
.newex input{flex:1;min-width:0}
.btn{padding:9px 15px;border-radius:10px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn:hover{background:#40334a}
.btn.pri{background:var(--ivy);color:#1a1d10;border-color:var(--ivy)}
.btn.pri:hover{background:#9db862}
.btn.ghost{background:none;border-color:transparent;color:var(--mut)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.entry{margin-top:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px}
.e-h{display:flex;align-items:center;gap:8px}
.e-h b{flex:1;font-size:15px}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.x:hover{background:var(--s3);color:var(--bad)}
.last{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:4px 0 8px}
.last span{flex:1}
.last button{color:var(--lime);font-weight:600;font-size:12.5px;padding:2px 6px;border-radius:6px}
.set-row{display:grid;grid-template-columns:22px 1fr 14px 1fr 28px;gap:6px;align-items:center;margin-top:6px}
.set-row .sn{font-size:12px;color:var(--dim);text-align:center;font-weight:600}
.set-row input{width:100%;padding:8px 10px;text-align:center;background:var(--s1)}
.set-row .mul{color:var(--dim);text-align:center;font-size:13px}
.set-hdr{display:grid;grid-template-columns:22px 1fr 14px 1fr 28px;gap:6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.e-f{display:flex;gap:8px;margin-top:10px}
.e-f input{flex:1;min-width:0;font-size:14px;padding:7px 10px;background:var(--s1)}
.c-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;align-items:end;position:relative}
.c-row label{display:flex;flex-direction:column;gap:3px}
.c-row label span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.c-row label.wide{grid-column:1/-1}
.c-row label.wide span{text-align:left}
.c-row input{width:100%;padding:8px 10px;text-align:center;background:var(--s1)}
.c-row label.wide input{text-align:left}
.c-row .sn{grid-column:1/-1;font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.c-row .x{position:absolute;right:0;top:4px}
.c-row+.c-row{border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
.remind{border-color:var(--lime);background:rgba(217,219,167,.07);color:var(--tx);flex-wrap:wrap}
.remind span{flex:1;min-width:200px}
.pill.Rest{background:rgba(125,106,143,.22);color:#d9c3e6}
.wo.rest{border-left:3px solid #7d6a8f}
.rtag{font-size:12.5px;padding:3px 10px;border-radius:20px;background:rgba(125,106,143,.18);color:#ddcbe8}
.rq{margin-top:20px}
.rq h3{font-size:17px;margin-bottom:10px}
.feels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
.feel{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.feel span{font-size:24px;line-height:1.1}
.feel.on{background:rgba(125,106,143,.25);border-color:#9c88b0;color:var(--tx)}
.rest-chips .chip.on{background:rgba(125,106,143,.25);border-color:#9c88b0;color:#ecdcf5}
.seg.mode button{padding:8px 16px}
.seg.mode button.on{background:var(--s3)}
.notes{margin-top:18px}
.notes textarea{width:100%;min-height:64px;resize:vertical}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));margin-top:18px;z-index:10;display:flex;gap:10px;align-items:center;background:rgba(42,33,49,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.savebar .sum{flex:1;font-size:13.5px;color:var(--mut)}
.savebar .sum b{color:var(--tx)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .k{font-size:12px;color:var(--mut);font-weight:500}
.tile .v{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:28px;font-weight:600;margin-top:4px;line-height:1.1}
.tile .v small{font-size:14px;color:var(--mut);font-weight:500;margin-left:3px}
.tile .d{font-size:12.5px;margin-top:4px;color:var(--mut)}
.up-t{color:var(--up)!important} .down-t{color:var(--bad)!important}
.sec{margin-top:16px}
.sec h3{font-size:16px;margin-bottom:10px}
.chart-wrap svg{display:block;width:100%;height:auto}
.readout{font-size:13px;color:var(--mut);margin-top:6px;min-height:20px}
.readout b{color:var(--tx)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--s2)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12.5px;color:var(--mut)}
.row .val{text-align:right;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:600}
.row .val span{display:block;font-family:Inter;font-size:12px;font-weight:500}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.pill.Lower{background:var(--lo-bg);color:var(--lo)} .pill.Upper{background:var(--up-bg);color:var(--up)}
.pill.Full{background:rgba(217,219,167,.12);color:var(--full)} .pill.Other{background:rgba(157,144,171,.16);color:var(--oth)} .pill.Cardio{background:var(--ca-bg);color:var(--ca)}
.pr{color:var(--lime);font-size:12px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:14px;margin-bottom:10px;padding:4px 0}
.back:hover{color:var(--tx)}
select.exsel{width:100%;max-width:420px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bal{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.bal .nm{text-transform:capitalize;color:var(--mut)}
.bal .track{height:10px;background:var(--s2);border-radius:6px;overflow:hidden}
.bal .fill{height:100%;border-radius:6px}
.bal .ago{text-align:right;font-size:12px;color:var(--dim)}
.bal .ago.stale{color:var(--mauve);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty h3{color:var(--tx);margin-bottom:6px}

/* history */
.month{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.wo{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.wo-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wo-h h3{font-size:16px;flex:1}
.wo-l{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:4px 14px;font-size:13.5px}
.wo-l .n{color:var(--tx);font-weight:500}
.wo-l .s{color:var(--mut)}
.wo-l .s i{color:var(--dim);font-style:normal}
.wo-note{font-size:13px;color:var(--mut);margin-top:8px;font-style:italic}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,7,12,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:20px;margin-bottom:14px}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.set-blk{padding:14px 0;border-bottom:1px solid var(--line)}
.set-blk:last-child{border-bottom:0}
.set-blk h3{font-size:15px;margin-bottom:8px}
.mg-cat{margin:12px 0}
.mg-cat b{font-size:13px;text-transform:capitalize;color:var(--mut)}
.mg-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mg-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:20px;background:var(--s2);border:1px solid var(--line);font-size:13px}
.mg-chip.hid{opacity:.45;text-decoration:line-through}
.mg-chip.cus{border-color:var(--lo-bd)}
.mg-chip button{width:20px;height:20px;border-radius:50%;color:var(--dim);font-size:13px;line-height:1}
.mg-chip button:hover{background:var(--s3);color:var(--tx)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-size:18px}
.stepper b{min-width:28px;text-align:center;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:20px}
textarea.io{width:100%;min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--lime);color:#1d1b12;font-weight:600;font-size:14px;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.mgrid{display:grid;gap:10px}
.mgrid.big{grid-template-columns:1fr 1fr}
.mgrid.small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mf{display:flex;flex-direction:column;gap:4px}
.mf span{font-size:12.5px;color:var(--mut);font-weight:500}
.mf span i{font-style:normal;color:var(--dim)}
.mf input{width:100%}
.mgrid.big input{font-family:"Space Grotesk",Inter,sans-serif;font-size:20px;padding:10px 12px}
.mgrid.small .mf span{font-size:11.5px}
.mgrid.small input{padding:6px 9px;font-size:16px}
.mf input::placeholder{color:var(--dim)}
.hidden{display:none!important}
</style>
</head>
<body>

  <div class="logo">
    <div class="logo-mark"><svg width="26" height="26" viewBox="-16 -16 32 32" aria-hidden="true"><defs><radialGradient id="hib" cx="0" cy="0" r="15" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5d3a55"/><stop offset=".35" stop-color="#9b5a7f"/><stop offset="1" stop-color="#ecb6c6"/></radialGradient></defs><g fill="url(#hib)" stroke="#16111a" stroke-width=".6"><path transform="rotate(0)" d="M0 0C-7 -2.5 -10.5 -10 -5 -14.2C-3 -15.6 -1.2 -14.4 0 -15.4C1.2 -14.4 3 -15.6 5 -14.2C10.5 -10 7 -2.5 0 0Z"/><path transform="rotate(72)" d="M0 0C-7 -2.5 -10.5 -10 -5 -14.2C-3 -15.6 -1.2 -14.4 0 -15.4C1.2 -14.4 3 -15.6 5 -14.2C10.5 -10 7 -2.5 0 0Z"/><path transform="rotate(144)" d="M0 0C-7 -2.5 -10.5 -10 -5 -14.2C-3 -15.6 -1.2 -14.4 0 -15.4C1.2 -14.4 3 -15.6 5 -14.2C10.5 -10 7 -2.5 0 0Z"/><path transform="rotate(216)" d="M0 0C-7 -2.5 -10.5 -10 -5 -14.2C-3 -15.6 -1.2 -14.4 0 -15.4C1.2 -14.4 3 -15.6 5 -14.2C10.5 -10 7 -2.5 0 0Z"/><path transform="rotate(288)" d="M0 0C-7 -2.5 -10.5 -10 -5 -14.2C-3 -15.6 -1.2 -14.4 0 -15.4C1.2 -14.4 3 -15.6 5 -14.2C10.5 -10 7 -2.5 0 0Z"/></g><circle r="2.6" fill="#4a2c45"/><path d="M0 0L6.5 -8.5" stroke="#d9dba7" stroke-width="1.3" stroke-linecap="round"/><g fill="#d9dba7"><circle cx="6.8" cy="-9.2" r="1.1"/><circle cx="5" cy="-9.6" r=".8"/><circle cx="7.9" cy="-7.6" r=".8"/><circle cx="4.6" cy="-7.8" r=".7"/></g></svg></div>

</div></header>

<main><div class="wrap" id="main"></div></main>

<nav class="tabs"><div class="wrap">
  <button data-act="tab" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</button>

</div></nav>

<div id="modal"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ---------------- constants ---------------- */
const CATS=[
  {key:'squat',name:'squat pattern',group:'Lower'},
  {key:'hinge',name:'hinge pattern',group:'Lower'},
  {key:'lunge',name:'lunge pattern',group:'Lower'},
  {key:'liso',name:'isolations',group:'Lower'},
  {key:'hpush',name:'horizontal push',group:'Upper'},
  {key:'vpush',name:'vertical push',group:'Upper'},
  {key:'hpull',name:'horizontal pull',group:'Upper'},
  {key:'vpull',name:'vertical pull',group:'Upper'},
  {key:'uiso',name:'isolations',group:'Upper'},
  {key:'core',name:'core',group:'Upper'},
  {key:'carry',name:'carries',group:'Upper'},
  {key:'cmach',name:'cardio machines',group:'Cardio'},
  {key:'cout',name:'outdoor & other',group:'Cardio'},
];
const CATMAP=Object.fromEntries(CATS.map(c=>[c.key,c]));
const DEFAULTS={
  squat:['back squat','front squat','goblet squat','leg press','hack squat','smith machine squat'],
  hinge:['romanian deadlift','deadlift','sumo deadlift','hip thrust','glute bridge','good morning','kettlebell swing','back extension'],
  lunge:['walking lunge','reverse lunge','bulgarian split squat','step-up','lateral lunge'],
  liso:['calf raise','leg extension','leg curl','hip abduction','hip adduction','seated calf raise'],
  hpush:['bench press','dumbbell bench press','incline bench press','incline dumbbell press','push-up','chest press machine'],
  vpush:['overhead press','dumbbell shoulder press','arnold press','landmine press','machine shoulder press'],
  hpull:['barbell row','dumbbell row','seated cable row','chest-supported row','inverted row'],
  vpull:['pull-up','chin-up','lat pulldown','assisted pull-up'],
  uiso:['bicep curl','hammer curl','tricep pushdown','skull crusher','overhead tricep extension','lateral raise','chest fly','rear delt fly','face pull'],
  core:['plank','side plank','dead bug','hanging leg raise','cable crunch','pallof press','ab wheel','russian twist'],
  carry:["farmer's carry",'suitcase carry','overhead carry','front rack carry'],
  cmach:['treadmill','stairmaster','elliptical','stationary bike','spin bike','rowing machine','assault bike','arc trainer','ski erg'],
  cout:['running','walking','hiking','cycling','swimming','jump rope','HIIT class','dance class'],
};
const TYPES=[['Lower','Lower'],['Upper','Upper'],['Full body','Full'],['Cardio','Cardio'],['Other','Other']];
const typeCls=t=>(TYPES.find(x=>x[0]===t)||['','Other'])[1];
const COLORS={Lower:'#bf96aa',Upper:'#a7c163',Full:'#d9dba7',Cardio:'#e3a98c',Other:'#9d90ab'};
const isCardioCat=c=>CATMAP[c]?.group==='Cardio';
const blankSet=c=>isCardioCat(c)?{t:'',d:'',c:'',l:''}:{r:'',w:''};

/* ---------------- state ---------------- */
const S={
  workouts:[], profile:{custom:{},hidden:[],goal:3,unit:'lbs'},
  tab:'log', draft:null, open:{Lower:true,Upper:false,Cardio:false}, newExCat:null,
  progEx:null, logMode:'workout', rest:[], rDraft:null, rNew:false, progMode:'lifts', cardEx:null, cMetric:'t', measures:[], mSel:'weight', mDraft:null, metric:'top', loaded:false, loadNote:null, mode:'connecting', ptSel:null, heatSel:null,
};
try{ const t=location.hash.slice(1); if(['log','progress','consistency','history'].includes(t)) S.tab=t; }catch(e){}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=(s,o={month:'short',day:'numeric'})=>parse(s).toLocaleDateString(undefined,o);
const num=v=>{if(v===''||v==null)return null;const n=Number(v);return isFinite(n)?n:null};
const fw=n=>n==null?'BW':(Math.round(n*10)/10).toLocaleString();
const cap=s=>String(s).charAt(0).toUpperCase()+String(s).slice(1);
const gid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const unit=()=>S.profile.unit||'lbs';
const clone=o=>JSON.parse(JSON.stringify(o));

function normProfile(p){p=clone(p||{});return {custom:p.custom||{},hidden:p.hidden||[],goal:p.goal||3,unit:p.unit||'lbs',lunit:p.lunit||'in',lastBackup:p.lastBackup||0,snooze:p.snooze||0,customRest:p.customRest||[]}}
function exercisesFor(cat){
  const hid=new Set(S.profile.hidden||[]);
  const list=(DEFAULTS[cat]||[]).filter(e=>!hid.has(cat+'|'+e));
  for(const c of (S.profile.custom[cat]||[])) if(!list.includes(c)) list.push(c);
  return list;
}
function allExerciseNames(){const s=new Set();for(const c of CATS){(DEFAULTS[c.key]||[]).forEach(e=>s.add(e.toLowerCase()));(S.profile.custom[c.key]||[]).forEach(e=>s.add(e.toLowerCase()))}return s}
const sortedAsc=()=>[...S.workouts].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));

const CARDIO_KEYS=['t','d','c','l'];
const hasVal=s=>['r','w','t','d','c'].some(k=>num(s[k])!=null)||!!(s.l&&String(s.l).trim());
const isCardioSet=s=>s&&CARDIO_KEYS.some(k=>k in s);
const dU=()=>S.profile.lunit==='cm'?'km':'mi';
const toDraftSets=sets=>(sets||[]).filter(hasVal).map(s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v==null?'':String(v)])));
function summarizeCardio(ss){
  return ss.map(s=>{const p=[];const t=num(s.t),d=num(s.d),c=num(s.c);
    if(t!=null)p.push(fw(t)+' min');if(d!=null)p.push(fw(d)+' '+dU());if(c!=null)p.push(Math.round(c)+' cal');if(s.l&&String(s.l).trim())p.push(String(s.l).trim());
    return p.join(' · ')}).join(' + ');
}
function summarize(sets){
  if((sets||[]).some(isCardioSet))return summarizeCardio((sets||[]).filter(hasVal));
  const ss=(sets||[]).filter(s=>hasVal(s));
  if(!ss.length)return '';
  const g=[];
  for(const s of ss){const r=num(s.r),w=num(s.w);const l=g[g.length-1];if(l&&l.r===r&&l.w===w)l.n++;else g.push({r,w,n:1})}
  return g.map(x=>`${x.n}×${x.r??'—'}${x.w!=null?' @ '+fw(x.w):' BW'}`).join(', ');
}

/* ---------------- storage ---------------- */
const LKEY='liftlog_v1', DKEY='liftlog_draft';
const Local={
  read(){try{return JSON.parse(localStorage.getItem(LKEY))||{workouts:{},profile:null}}catch(e){return {workouts:{},profile:null}}},
  write(d){try{localStorage.setItem(LKEY,JSON.stringify(d))}catch(e){}}
};
const Store={
  wcol:null, pref:null, pq:Promise.resolve(), pTimer:null,
  async init(){
    let db=null,user=null,id=null;
    try{
      for(let i=0;i<20&&!(window.claude&&typeof window.claude.use==='function');i++) await new Promise(r=>setTimeout(r,100));
      if(window.claude&&typeof window.claude.use==='function'){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}
      if(user) id=await user.id();
    }catch(e){}
    if(db&&id){
      try{this.pref=db.doc('data/users/'+id+'/profile');this.wcol=this.pref.collection('workouts');S.mode='cloud';this.subscribe();return}catch(e){}
    }
    this.useLocal();
  },
  useLocal(){
    S.mode='local';const d=Local.read();
    S.workouts=Object.entries(d.workouts||{}).map(([id,v])=>({...v,id}));
    S.measures=Object.entries(d.measures||{}).map(([id,v])=>({...v,id}));
    S.rest=Object.entries(d.rest||{}).map(([id,v])=>({...v,id}));
    if(d.profile)S.profile=normProfile(d.profile);
    S.loaded=true;render();
  },
  subscribe(){
    let gw=false,gp=false;
    const timer=setTimeout(()=>{if(!S.loaded){S.loadNote="Can't reach your saved workouts yet. Keep this open; it'll keep trying.";softRender()}},10000);
    const done=()=>{if(gw&&gp){clearTimeout(timer);S.loaded=true;S.loadNote=null}};
    this.wcol.onSnapshot(snap=>{
      S.workouts=snap.docs.map(d=>({...clone(d.data()),id:d.id}));
      if(!snap.metadata.fromCache){gw=true;done()}
      softRender();
    },err=>{clearTimeout(timer);S.loaded=true;S.loadNote="Couldn't load saved workouts ("+err.code+"). Try reopening the page.";softRender()});
    this.rcol=this.pref.collection('rest');
    this.rcol.onSnapshot(snap=>{S.rest=snap.docs.map(d=>({...clone(d.data()),id:d.id}));softRender()},()=>{});
    this.mcol=this.pref.collection('measures');
    this.mcol.onSnapshot(snap=>{S.measures=snap.docs.map(d=>({...clone(d.data()),id:d.id}));softRender()},()=>{});
    this.pref.onSnapshot(snap=>{
      if(snap.exists&&!this.pTimer)S.profile=normProfile(snap.data());
      if(!snap.metadata.fromCache){gp=true;done()}
      softRender();
    },()=>{gp=true;done()});
  },
  async saveWorkout(id,doc){
    if(S.mode==='cloud'){await this.wcol.doc(id).set(doc)}
    else{const d=Local.read();d.workouts[id]=doc;Local.write(d)}
    const i=S.workouts.findIndex(w=>w.id===id);
    if(i>=0)S.workouts[i]={...doc,id};else S.workouts.push({...doc,id});
  },
  async deleteWorkout(id){
    if(S.mode==='cloud'){await this.wcol.doc(id).delete()}
    else{const d=Local.read();delete d.workouts[id];Local.write(d)}
    S.workouts=S.workouts.filter(w=>w.id!==id);
  },
  async saveRest(id,doc){
    if(S.mode==='cloud'){await this.rcol.doc(id).set(doc)}
    else{const d=Local.read();(d.rest=d.rest||{})[id]=doc;Local.write(d)}
    const i=S.rest.findIndex(m=>m.id===id);
    if(i>=0)S.rest[i]={...doc,id};else S.rest.push({...doc,id});
  },
  async deleteRest(id){
    if(S.mode==='cloud'){await this.rcol.doc(id).delete()}
    else{const d=Local.read();if(d.rest)delete d.rest[id];Local.write(d)}
    S.rest=S.rest.filter(m=>m.id!==id);
  },
  async saveMeasure(id,doc){
    if(S.mode==='cloud'){await this.mcol.doc(id).set(doc)}
    else{const d=Local.read();(d.measures=d.measures||{})[id]=doc;Local.write(d)}
    const i=S.measures.findIndex(m=>m.id===id);
    if(i>=0)S.measures[i]={...doc,id};else S.measures.push({...doc,id});
  },
  async deleteMeasure(id){
    if(S.mode==='cloud'){await this.mcol.doc(id).delete()}
    else{const d=Local.read();if(d.measures)delete d.measures[id];Local.write(d)}
    S.measures=S.measures.filter(m=>m.id!==id);
  },
  saveProfile(){
    if(S.mode!=='cloud'){const d=Local.read();d.profile=S.profile;Local.write(d);return}
    clearTimeout(this.pTimer);
    this.pTimer=setTimeout(()=>{
      const body=clone(S.profile);
      this.pq=this.pq.then(()=>this.pref.set(body)).catch(e=>toast(errMsg(e))).finally(()=>{this.pTimer=null});
    },400);
  }
};
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return "Couldn't save: this view isn't allowed to write.";
  if(c==='quota_exceeded')return 'Storage is full. Delete some old workouts.';
  if(c==='revoked')return 'Access to saved data was withdrawn.';
  return "Couldn't save. Check your connection and try again.";
}

/* ---------------- draft ---------------- */
function newDraft(){return {id:null,date:todayISO(),type:'Lower',entries:[],notes:''}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DKEY));if(d&&Array.isArray(d.entries))return d}catch(e){}return newDraft()}
let dTimer;function persistDraft(){clearTimeout(dTimer);dTimer=setTimeout(()=>{try{localStorage.setItem(DKEY,JSON.stringify(S.draft))}catch(e){}},300)}
S.draft=loadDraft();
if(!S.draft.id&&!S.draft.entries.length)S.draft.date=todayISO();
setOpenForType(S.draft.type,true);

function setOpenForType(t,keepEntries){
  S.open={Lower:['Lower','Full body','Other'].includes(t),Upper:['Upper','Full body','Other'].includes(t),Cardio:['Cardio','Other'].includes(t)};
  if(keepEntries)for(const e of S.draft.entries){const c=CATMAP[e.cat];if(c)S.open[c.group]=true}
}
function lastFor(ex){
  const ws=sortedAsc().filter(w=>w.id!==S.draft.id&&w.date<=S.draft.date).reverse();
  for(const w of ws){const sets=[];for(const e of w.entries||[])if(e.ex===ex)sets.push(...(e.sets||[]));if(sets.length)return {date:w.date,sets}}
  return null;
}

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
  const sy=$('#sync');
  sy.innerHTML=S.mode==='cloud'?`<span class="dot ${S.loaded?'ok':''}"></span><span>${S.loaded?'Synced':'Loading…'}</span>`
    :S.mode==='local'?`<span class="dot warn"></span><span>This device only</span>`:`<span class="dot"></span><span>Connecting…</span>`;
  const m=$('#main');
  const html=({log:viewLog,progress:viewProgress,consistency:viewConsistency,history:viewHistory}[S.tab]||viewLog)();
  m.innerHTML=(S.loadNote?`<div class="banner">${esc(S.loadNote)}</div>`:'')+(backupDue()?`<div class="banner remind"><span>📦 <b>Time for a backup.</b> ${S.profile.lastBackup?`Your last one was ${fmtD(iso(new Date(S.profile.lastBackup)))}.`:`You haven't made one yet.`} Copy it and paste it into a personal note or email, so your data isn't stuck on your school account.</span><button class="btn sm pri" data-act="backupNow">Copy backup</button><button class="btn sm ghost" data-act="backupLater">Later</button></div>`:'')+html;
}
function softRender(){
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&($('#main').contains(a)||$('#modal').contains(a)))return;
  if($('#modal').firstChild&&S.modal==='settings'){renderSettings()}
  render();
}

/* ----- Log view ----- */
function viewLog(){
  if(S.logMode==='rest')return viewRest();
  const d=S.draft;
  const nEx=d.entries.length,nSets=d.entries.reduce((a,e)=>a+e.sets.filter(s=>hasVal(s)).length,0);
  const groups=d.type==='Cardio'?['Cardio','Lower','Upper']:d.type==='Upper'?['Upper','Lower','Cardio']:['Lower','Upper','Cardio'];
  let h=`<div class="view-title"><h2>${d.id?'Edit workout':'Log workout'}</h2><span class="sub">${fmtD(d.date,{weekday:'long',month:'long',day:'numeric'})}</span></div>`+logModeSeg();
  if(d.id)h+=`<div class="banner edit"><span>Editing the ${fmtD(d.date)} workout. Saving overwrites it.</span><button class="btn sm ghost" data-act="discard">Cancel edit</button></div>`;
  h+=`<div class="card"><div class="top-row">
    <label class="field"><span>Date</span><input type="date" data-f="date" value="${esc(d.date)}"></label>
    <div class="field"><span>Workout type</span><div class="seg">${TYPES.map(([t,c])=>`<button class="t-${c} ${d.type===t?'on':''}" data-act="type" data-v="${t}">${t}</button>`).join('')}</div></div>
  </div></div>`;
  for(const g of groups){
    const cats=CATS.filter(c=>c.group===g);
    const cnt=d.entries.filter(e=>CATMAP[e.cat]?.group===g).length;
    const cls=g==='Lower'?'grp-lo':g==='Upper'?'grp-up':'grp-ca';
    h+=`<section class="grp ${cls} ${S.open[g]?'':'closed'}">
      <button class="grp-h" data-act="grp" data-v="${g}"><span class="bar"></span><h3>${g==='Cardio'?'Cardio':g+' body'}</h3>
        <span class="meta">${cnt?cnt+' exercise'+(cnt>1?'s':''):''}</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>`;
    if(S.open[g]){
      h+=`<div class="grid">`;
      for(const c of cats){
        const ents=d.entries.filter(e=>e.cat===c.key);
        const inW=new Set(ents.map(e=>e.ex));
        h+=`<div class="cat" id="cat-${c.key}"><div class="cat-h"><b>${esc(c.name)}</b>${ents.length?`<span class="cnt">${ents.length}</span>`:''}</div>
          <div class="chips">${exercisesFor(c.key).map(e=>`<button class="chip ${inW.has(e)?'on':''}" data-act="addEx" data-cat="${c.key}" data-ex="${esc(e)}">${esc(e)}</button>`).join('')}
          <button class="chip new" data-act="newEx" data-cat="${c.key}">+ new</button></div>

/* ----- Progress view ----- */
function seriesFor(ex){
  const rows=[];
  for(const w of sortedAsc()){
    const sets=[];for(const e of w.entries||[])if(e.ex===ex)sets.push(...(e.sets||[]));
    if(!sets.length)continue;
    let top=null,e1=null,vol=0,maxR=null;
    for(const s of sets){const r=num(s.r),wt=num(s.w);
      if(r!=null)maxR=Math.max(maxR??0,r);
      if(wt!=null){top=Math.max(top??-Infinity,wt);if(r!=null&&r>0){const est=r===1?wt:wt*(1+r/30);e1=Math.max(e1??0,est);vol+=r*wt}}}
    rows.push({date:w.date,wid:w.id,sets,top,e1,vol,maxR});
  }
  return rows;
}
function exerciseIndex(){
  const m=new Map();
  for(const w of S.workouts)for(const e of w.entries||[]){if(!(e.sets||[]).length||isCardioCat(e.cat))continue;const k=e.ex;const cur=m.get(k);if(!cur||w.date>cur.last)m.set(k,{ex:k,cat:e.cat,last:w.date})}
  return [...m.values()].sort((a,b)=>a.last<b.last?1:-1);
}
function computePRs(){
  const best={},prs=[],set=new Set();
  for(const w of sortedAsc())for(const e of w.entries||[]){
    let top=null;for(const s of e.sets||[]){const x=num(s.w);if(x!=null)top=Math.max(top??-Infinity,x)}
    if(top==null)continue;
    if(best[e.ex]!=null&&top>best[e.ex]){prs.push({date:w.date,ex:e.ex,top,prev:best[e.ex]});set.add(w.id+'|'+e.ex)}
    best[e.ex]=Math.max(best[e.ex]??-Infinity,top);
  }
  return {prs,set,best};
}

const fmtV=(v,m)=>m==='vol'?Math.round(v).toLocaleString():m==='e1'?String(Math.round(v)):fw(v);
function readoutHTML(pts,i,metric,u){

/* ----- charts ----- */
function niceTicks(lo,hi,n=4){
  if(lo===hi){lo-=1;hi+=1}
  const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag;
  const step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));
  return t;
}
function lineChart(pts,color,metric,low){
  if(!pts.length)return `<div class="empty">No data for this metric yet.</div>`;
  const W=640,H=250,pl=46,pr=18,pt=16,pb=30;
  const xs=pts.map(p=>parse(p.d).getTime()),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const ticks=niceTicks(Math.min(...ys),Math.max(...ys));
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=t=>x1===x0?(pl+(W-pl-pr)/2):pl+(t-x0)/(x1-x0)*(W-pl-pr);
  const Y=v=>pt+(1-(v-y0)/((y1-y0)||1))*(H-pt-pb);
  let g='';
  for(const t of ticks){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#3d3147" stroke-width="1"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="#7f6f83">${fmtV(t,metric)}</text>`}
  const xl=[0];if(pts.length>2)xl.push(Math.floor((pts.length-1)/2));if(pts.length>1)xl.push(pts.length-1);
  for(const i of xl){const anchor=i===0?'start':i===pts.length-1?'end':'middle';g+=`<text x="${X(xs[i])}" y="${H-8}" text-anchor="${pts.length===1?'middle':anchor}" font-size="11" fill="#7f6f83">${fmtD(pts[i].d)}</text>`}
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=pts.length>1?`${line}L${X(xs[xs.length-1])},${H-pb}L${X(xs[0])},${H-pb}Z`:'';
  const best=low?Math.min(...ys):Math.max(...ys);
  const sel=S.ptSel??pts.length-1;
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i===sel?6:4}" fill="${p.y===best?'#d9dba7':color}" stroke="#201925" stroke-width="2"/><circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="14" fill="transparent" data-act="pt" data-i="${i}" style="cursor:pointer"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${area?`<path d="${area}" fill="url(#ga)"/>`:''}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function spark(vals,color){
  if(vals.length<2)return `<svg width="84" height="28"></svg>`;
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const p=vals.map((v,i)=>`${i?'L':'M'}${(2+i/(vals.length-1)*80).toFixed(1)},${(24-(hi===lo?.5:(v-lo)/(hi-lo))*20).toFixed(1)}`).join('');
  return `<svg width="84" height="28" viewBox="0 0 84 28"><path d="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ----- Consistency view ----- */
function viewConsistency(){
  if(!S.loaded&&!S.workouts.length)return loadingHTML();
  const goal=S.profile.goal||3;
  const today=new Date(),tISO=iso(today);
  const byWeek={};const byDay={};
  for(const w of S.workouts){const k=iso(weekStart(parse(w.date)));byWeek[k]=(byWeek[k]||0)+1;(byDay[w.date]=byDay[w.date]||[]).push(w)}
  const thisW=iso(weekStart(today));const thisCount=byWeek[thisW]||0;
  let streak=0;let wk=weekStart(today);
  if(thisCount<goal)wk=addDays(wk,-7);
  while((byWeek[iso(wk)]||0)>=goal){streak++;wk=addDays(wk,-7)}
  let bestStreak=0,run=0;
  if(S.workouts.length){const firstW=weekStart(parse(sortedAsc()[0].date));for(let d=new Date(firstW);d<=today;d=addDays(d,7)){if((byWeek[iso(d)]||0)>=goal){run++;bestStreak=Math.max(bestStreak,run)}else if(iso(d)!==thisW)run=0}}
  const since30=iso(addDays(today,-29));

const restDays=()=>new Set(S.rest.map(r=>r.date));
function dayColor(ws){

function heatmap(byDay,today){
  const weeks=22,cs=15,gap=3,left=26,top=18;
  const start=addDays(weekStart(today),-(weeks-1)*7);
  const W=left+weeks*(cs+gap),H=top+7*(cs+gap);
  let g='';let lastM=-1;
  for(let c=0;c<weeks;c++){
    const ws=addDays(start,c*7);
    if(ws.getMonth()!==lastM){lastM=ws.getMonth();g+=`<text x="${left+c*(cs+gap)}" y="11" font-size="10.5" fill="#7f6f83">${ws.toLocaleDateString(undefined,{month:'short'})}</text>`}
    for(let r=0;r<7;r++){
      const d=addDays(ws,r),k=iso(d),fut=d>today;
      const items=byDay[k];
      const fill=fut?'transparent':items?dayColor(items):restDays().has(k)?REST_COLOR:'#2a2131';
      const sel=S.heatSel===k?' stroke="#f2eae7" stroke-width="1.5"':'';
      g+=`<rect x="${left+c*(cs+gap)}" y="${top+r*(cs+gap)}" width="${cs}" height="${cs}" rx="3.5" fill="${fill}"${fut?' stroke="#2a2131"':''}${sel} ${fut?'':`data-act="heat" data-d="${k}" style="cursor:pointer"`}/>`;
    }
  }
  ['M','','W','','F','',''].forEach((l,i)=>{if(l)g+=`<text x="0" y="${top+i*(cs+gap)+11}" font-size="10" fill="#7f6f83">${l}</text>`});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,520)}px;max-width:${Math.round(W*1.45)}px">${g}</svg></div>`;
}
function heatReadout(k,byDay){
  const ws=byDay[k]||[],rs=S.rest.find(r=>r.date===k),dl=`<b>${fmtD(k,{weekday:'short',month:'short',day:'numeric'})}</b>`;
  const lines=ws.map(w=>`${dl} · ${esc(w.type)} · ${esc((w.entries||[]).map(e=>e.ex).join(', '))}`);
  if(rs)lines.push(`${dl} · 🌺 Rest day ${feelOf(rs.feel)} · ${esc([...(rs.acts||[]),rs.note].filter(Boolean).join(' · '))}`);
  return lines.length?lines.join('<br>'):`${dl} · nothing logged`;
}
function weekBars(byWeek,goal,today){
  const n=12,W=340,H=180,pl=22,pb=24,pt=10;
  const start=addDays(weekStart(today),-(n-1)*7);
  const vals=[...Array(n)].map((_,i)=>byWeek[iso(addDays(start,i*7))]||0);
  const mx=Math.max(goal+1,...vals);
  const bw=(W-pl)/n;
  const Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let g='';
  for(let v=0;v<=mx;v+=mx>8?2:1)g+=`<text x="0" y="${Y(v)+4}" font-size="10" fill="#7f6f83">${v}</text>`;
  vals.forEach((v,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64;
    const col=v>=goal?'#a7c163':v>0?'#9b7b8b':'#2a2131';
    g+=`<rect x="${x}" y="${v?Y(v):H-pb-3}" width="${w}" height="${v?H-pb-Y(v):3}" rx="3" fill="${col}"/>`;
    if(i%3===0||i===n-1)g+=`<text x="${x+w/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="#7f6f83">${i===n-1?'now':fmtD(iso(addDays(start,i*7)))}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#d9dba7" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W}" y="${Y(goal)-4}" font-size="10" text-anchor="end" fill="#d9dba7">goal</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:#a7c163"></i>Goal met</span><span><i style="background:#9b7b8b"></i>Under goal</span></div>`;
}

function cardioRows(){
  const rows=[];
  for(const w of sortedAsc())for(const e of w.entries||[]){if(!isCardioCat(e.cat))continue;
    let t=0,d=0,c=0,ht=false,hd=false,hc=false;
    for(const s of e.sets||[]){const a=num(s.t),b=num(s.d),k=num(s.c);if(a!=null){t+=a;ht=true}if(b!=null){d+=b;hd=true}if(k!=null){c+=k;hc=true}}
    rows.push({date:w.date,wid:w.id,ex:e.ex,cat:e.cat,sets:e.sets||[],t:ht?t:null,d:hd?d:null,c:hc?c:null,pace:ht&&hd&&d>0?t/d:null});
  }
  return rows;
}

  </div>`;
  // weekly minutes
  const n=12,start=addDays(weekStart(today),-(n-1)*7);
  const vals=[...Array(n)].map((_,i)=>{const k=iso(addDays(start,i*7));return rows.filter(r=>iso(weekStart(parse(r.date)))===k).reduce((a,r)=>a+(r.t||0),0)});
  const W=640,H=190,pl=34,pb=24,pt=12,mx=Math.max(30,...vals),bw=(W-pl)/n,Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let g='';for(const v of niceTicks(0,mx,3)){if(v>mx)continue;g+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3d3147"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#7f6f83">${v}</text>`}
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;g+=`<rect x="${x}" y="${v?Y(v):H-pb-3}" width="${w}" height="${v?H-pb-Y(v):3}" rx="3" fill="${v?COLORS.Cardio:'#2a2131'}"/>`;if(i%3===0||i===n-1)g+=`<text x="${x+w/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="#7f6f83">${i===n-1?'this wk':fmtD(iso(addDays(start,i*7)))}</text>`});
  h+=`<div class="card chart-wrap"><h3 style="font-size:16px;margin-bottom:10px">Cardio minutes per week</h3><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
  // activities
  const acts=new Map();for(const r of rows){const a=acts.get(r.ex)||{ex:r.ex,cat:r.cat,rs:[]};a.rs.push(r);acts.set(r.ex,a)}
  const list=[...acts.values()].sort((a,b)=>a.rs[a.rs.length-1].date<b.rs[b.rs.length-1].date?1:-1);
  h+=`<div class="card sec"><h3 style="font-size:16px;margin-bottom:4px">Activities</h3><div class="sub" style="margin-bottom:6px">Minutes per session · tap for details</div><div class="list">`+list.map(a=>{const l=a.rs[a.rs.length-1];
    return `<div class="row click" data-act="cpick" data-ex="${esc(a.ex)}"><div class="nm"><b>${esc(cap(a.ex))}</b><span>${a.rs.length} session${a.rs.length>1?'s':''} · last ${fmtD(l.date)}: ${esc(summarize(l.sets))}</span></div>${spark(a.rs.map(r=>r.t).filter(v=>v!=null),COLORS.Cardio)}</div>`}).join('')+`</div></div>`;
  return h;
}
const CMET={t:['Time','min'],d:['Distance',null],c:['Calories','cal'],pace:['Pace',null]};

    <div class="tile"><div class="k">Sessions</div><div class="v">${rs.length}</div><div class="d">since ${fmtD(rs[0].date,{month:'short',day:'numeric',year:'numeric'})}</div></div>

  <div class="card sec"><h3>Session log</h3><div class="list">${[...rs].reverse().map(r=>`<div class="row"><div class="nm"><b>${fmtD(r.date,{weekday:'short',month:'short',day:'numeric'})}</b><span>${esc(summarize(r.sets))}</span></div><div class="val">${r.t!=null?fw(r.t)+' min':''}<span>${r.pace?fmtPace(r.pace)+' /'+dU():''}</span></div></div>`).join('')}</div></div>`;
  return h;
}

function entryOf(el){const id=el.closest('.entry')?.dataset.eid;return S.draft.entries.find(e=>e.id===id)}
function addExercise(cat,ex){
  const has=S.draft.entries.find(e=>e.ex===ex);
  if(has){const el=document.querySelector(`[data-eid="${has.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'});return}
  const last=lastFor(ex);
  const sets=last?toDraftSets(last.sets):[];
  const e={id:gid(),cat,ex,sets:sets.length?[{...sets[0]}]:[blankSet(cat)],note:''};
  S.draft.entries.push(e);persistDraft();render();
  const el=document.querySelector(`[data-eid="${e.id}"] input[data-f="r"]`);el&&el.focus({preventScroll:false});
}
function addCustom(cat,name){
  name=name.trim().replace(/\s+/g,' ');if(!name)return null;
  const low=name.toLowerCase();
  for(const c of CATS){const hit=[...DEFAULTS[c.key],...(S.profile.custom[c.key]||[])].find(e=>e.toLowerCase()===low);if(hit){
    const k=c.key+'|'+hit;if(S.profile.hidden.includes(k)){S.profile.hidden=S.profile.hidden.filter(x=>x!==k);Store.saveProfile()}
    return {cat:c.key,ex:hit}}}
  (S.profile.custom[cat]=S.profile.custom[cat]||[]).push(low===name.toLowerCase()?name.toLowerCase():name);
  Store.saveProfile();return {cat,ex:name.toLowerCase()};
}
async function saveWorkout(){
  const d=S.draft;
  const entries=d.entries.map(e=>({cat:e.cat,ex:e.ex,note:(e.note||'').trim(),sets:e.sets.map(s=>isCardioCat(e.cat)?{t:num(s.t),d:num(s.d),c:num(s.c),l:String(s.l||'').trim()}:{r:num(s.r),w:num(s.w)}).filter(hasVal)})).filter(e=>e.sets.length||e.note);
  if(!entries.length){toast('Add at least one set first');return}
  const id=d.id||gid();
  const old=S.workouts.find(w=>w.id===id);
  const doc={date:d.date,type:d.type,notes:(d.notes||'').trim(),entries,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};
  // PR check
  const prev={};for(const w of S.workouts){if(w.id===id||w.date>d.date)continue;for(const e of w.entries||[])for(const s of e.sets||[]){const x=num(s.w);if(x!=null)prev[e.ex]=Math.max(prev[e.ex]??-Infinity,x)}}
  const prs=[];for(const e of entries){const t=Math.max(...e.sets.map(s=>s.w??-Infinity));if(isFinite(t)&&prev[e.ex]!=null&&t>prev[e.ex])prs.push(`${cap(e.ex)} ${fw(t)} ${unit()}`)}
  const btn=document.querySelector('[data-act="saveWorkout"]');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{
    await Store.saveWorkout(id,doc);
    S.draft=newDraft();setOpenForType(S.draft.type);persistDraft();
    toast(prs.length?`🏆 New PR: ${prs.join(', ')}`:(old?'Workout updated':'Workout saved ✓'));
    window.scrollTo({top:0});render();
  }catch(e){toast(errMsg(e));if(btn){btn.disabled=false;btn.textContent='Save workout'}}
}
function startEdit(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return;
  const go=()=>{
    S.draft={id:w.id,date:w.date,type:w.type||'Other',notes:w.notes||'',entries:(w.entries||[]).map(e=>({id:gid(),cat:e.cat,ex:e.ex,note:e.note||'',sets:(e.sets||[]).map(s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v==null?'':String(v)])))}))};
    setOpenForType(S.draft.type,true);persistDraft();S.tab='log';setHash();window.scrollTo({top:0});render();
  };
  if(S.draft.entries.length&&S.draft.id!==id)confirmBox('Discard the workout you were logging and edit this one?',go,'Discard & edit');else go();
}
function setHash(){try{history.replaceState(null,'','#'+S.tab)}catch(e){try{location.hash=S.tab}catch(_){}}}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t)return;
  const a=t.dataset.act;
  if(a==='closeModal'){if(ev.target.closest('[data-stop]')&&t.classList.contains('ov'))return;closeModal();return}
  switch(a){
    case 'tab':S.tab=t.dataset.v;S.ptSel=null;setHash();closeModal();window.scrollTo({top:0});render();break;
    case 'type':S.draft.type=t.dataset.v;setOpenForType(S.draft.type,true);persistDraft();render();break;
    case 'grp':S.open[t.dataset.v]=!S.open[t.dataset.v];render();break;
    case 'addEx':addExercise(t.dataset.cat,t.dataset.ex);break;
    case 'newEx':S.newExCat=t.dataset.cat;render();setTimeout(()=>$('#newExIn')?.focus(),0);break;
    case 'cancelNewEx':S.newExCat=null;render();break;
    case 'saveNewEx':{const r=addCustom(t.dataset.cat,$('#newExIn')?.value||'');S.newExCat=null;if(r)addExercise(r.cat,r.ex);else render();break}
    case 'rmEntry':{const e=entryOf(t);S.draft.entries=S.draft.entries.filter(x=>x!==e);persistDraft();render();break}
    case 'addSet':{const e=entryOf(t);const l=e.sets[e.sets.length-1]||blankSet(e.cat);e.sets.push({...l});persistDraft();render();
      const ins=document.querySelectorAll(`[data-eid="${e.id}"] input[data-f="r"]`);ins[ins.length-1]?.focus();break}
    case 'rmSet':{const e=entryOf(t);e.sets.splice(+t.dataset.i,1);if(!e.sets.length)e.sets.push(blankSet(e.cat));persistDraft();render();break}
    case 'useLast':{const e=entryOf(t);const l=lastFor(e.ex);if(l){e.sets=toDraftSets(l.sets);if(!e.sets.length)e.sets=[blankSet(e.cat)];persistDraft();render()}break}
    case 'discard':{const go=()=>{S.draft=newDraft();setOpenForType(S.draft.type);persistDraft();render()};
      if(S.draft.entries.length&&!S.draft.id)confirmBox('Clear this workout?',go,'Clear');else go();break}
    case 'saveWorkout':saveWorkout();break;
    case 'pickEx':S.progEx=t.dataset.ex||null;S.ptSel=null;window.scrollTo({top:0});render();break;
    case 'metric':S.metric=t.dataset.v;S.ptSel=null;render();break;
    case 'pt':S.ptSel=+t.dataset.i;render();break;
    case 'heat':S.heatSel=t.dataset.d;render();break;
    case 'editW':startEdit(t.dataset.id);break;
    case 'delW':{const w=S.workouts.find(x=>x.id===t.dataset.id);confirmBox(`Delete the ${fmtD(w.date)} workout? This can't be undone.`,async()=>{try{await Store.deleteWorkout(w.id);toast('Workout deleted');render()}catch(e){toast(errMsg(e))}});break}
    case 'openSettings':renderSettings();break;
    case 'goal':S.profile.goal=Math.min(7,Math.max(1,(S.profile.goal||3)+(+t.dataset.v)));Store.saveProfile();renderSettings();render();break;
    case 'lunit':S.profile.lunit=t.dataset.v;Store.saveProfile();renderSettings();render();break;
    case 'pmode':S.progMode=t.dataset.v;S.ptSel=null;render();break;
    case 'mSel':S.mSel=t.dataset.v;S.ptSel=null;render();break;
    case 'saveMeas':saveMeasure();break;
    case 'editMeas':{const m=S.measures.find(x=>x.id===t.dataset.id);if(m){S.mDraft={date:m.date,vals:Object.fromEntries(Object.entries(m.vals||{}).map(([k,v])=>[k,String(v)]))};render();document.getElementById('mlog')?.scrollIntoView({behavior:'smooth',block:'start'})}break}
    case 'delMeas':{const m=S.measures.find(x=>x.id===t.dataset.id);confirmBox(`Delete measurements from ${fmtD(m.date)}?`,async()=>{try{await Store.deleteMeasure(m.id);toast('Deleted');render()}catch(e){toast(errMsg(e))}});break}
    case 'logMode':S.logMode=t.dataset.v;window.scrollTo({top:0});render();break;
    case 'rfeel':{const r=rD(),v=+t.dataset.v;r.feel=r.feel===v?null:v;render();break}
    case 'ract':{const r=rD(),v=t.dataset.v;r.acts=r.acts.includes(v)?r.acts.filter(x=>x!==v):[...r.acts,v];render();break}
    case 'rnew':S.rNew=true;render();setTimeout(()=>$('#rNewIn')?.focus(),0);break;
    case 'rNewCancel':S.rNew=false;render();break;
    case 'rNewSave':{const v=($('#rNewIn')?.value||'').trim().toLowerCase().replace(/\s+/g,' ');S.rNew=false;if(v){if(!restActs().includes(v)){S.profile.customRest=[...(S.profile.customRest||[]),v];Store.saveProfile()}const r=rD();if(!r.acts.includes(v))r.acts.push(v)}render();break}
    case 'saveRest':saveRest();break;
    case 'clearRest':S.rDraft=null;render();break;
    case 'loadRest':loadRest(t.dataset.id);break;
    case 'delRest':{const x=S.rest.find(r=>r.id===t.dataset.id);confirmBox(`Delete the ${fmtD(x.date)} rest day?`,async()=>{try{await Store.deleteRest(x.id);toast('Deleted');render()}catch(e){toast(errMsg(e))}});break}
    case 'delCustomRest':S.profile.customRest=(S.profile.customRest||[]).filter(x=>x!==t.dataset.v);Store.saveProfile();renderSettings();render();break;
    case 'clearMeas':S.mDraft=null;render();break;
    case 'unit':S.profile.unit=t.dataset.v;Store.saveProfile();renderSettings();render();break;
    case 'toggleHide':{const k=t.dataset.k;const h=new Set(S.profile.hidden);h.has(k)?h.delete(k):h.add(k);S.profile.hidden=[...h];Store.saveProfile();renderSettings();render();break}
    case 'delCustom':{const c=t.dataset.cat;S.profile.custom[c]=(S.profile.custom[c]||[]).filter(x=>x!==t.dataset.ex);Store.saveProfile();renderSettings();render();break}
    case 'addCustomSet':{const inp=document.querySelector(`[data-addcat="${t.dataset.cat}"]`);if(inp&&inp.value.trim()){addCustom(t.dataset.cat,inp.value);renderSettings();render();toast('Exercise added')}break}
    case 'exportData':case 'backupNow':doBackup();break;
    case 'backupLater':S.profile.snooze=Date.now()+3*864e5;Store.saveProfile();render();break;
    case 'cpick':S.cardEx=t.dataset.ex||null;S.ptSel=null;window.scrollTo({top:0});render();break;
    case 'cmetric':S.cMetric=t.dataset.v;S.ptSel=null;render();break;
    case 'importData':{let d;try{d=JSON.parse($('#importTxt').value)}catch(e){toast("That doesn't look like a backup");break}
      if(!d||!Array.isArray(d.workouts)){toast("That doesn't look like a backup");break}
      (async()=>{let n=0;for(const w of d.workouts){if(!w||!w.date||!Array.isArray(w.entries))continue;const {id,...rest}=w;try{await Store.saveWorkout(id&&/^[\w.-]+$/.test(id)?id:gid(),rest);n++}catch(e){toast(errMsg(e));break}}
        for(const r of (Array.isArray(d.rest)?d.rest:[])){if(!r||!r.date)continue;try{await Store.saveRest('r'+r.date,{date:r.date,acts:r.acts||[],feel:r.feel||null,note:r.note||'',updatedAt:Date.now()})}catch(e){}}
        if(d.profile&&Array.isArray(d.profile.customRest)){S.profile.customRest=[...new Set([...(S.profile.customRest||[]),...d.profile.customRest])]}
        for(const m of (Array.isArray(d.measures)?d.measures:[])){if(!m||!m.date||!m.vals)continue;try{await Store.saveMeasure('m'+m.date,{date:m.date,vals:m.vals,updatedAt:Date.now()})}catch(e){}}
        if(d.profile){const p=normProfile(d.profile);for(const k in p.custom){S.profile.custom[k]=[...new Set([...(S.profile.custom[k]||[]),...p.custom[k]])]}Store.saveProfile()}
        toast(`Imported ${n} workout${n!==1?'s':''}`);closeModal();render()})();break}
  }
});

  if(f==='date'){if(t.value){S.draft.date=t.value;persistDraft()}return}
  if(f==='notes'){S.draft.notes=t.value;persistDraft();return}
  if(f==='rdate'){if(t.value){const r=rD();if(r.loaded&&t.value!==r.date){}r.date=t.value}return}
  if(f==='rnote'){rD().note=t.value;const sb=document.querySelector('[data-act="saveRest"]');if(sb&&t.value.trim()){sb.disabled=false;sb.style.opacity=''}return}
  if(f==='mdate'){if(t.value){mD().date=t.value;}return}
  if(f==='progEx'){S.progEx=t.value;S.ptSel=null;render();return}
  const e=entryOf(t);if(!e)return;
  if(f==='note'){e.note=t.value}else{e.sets[+t.dataset.i][f]=f==='l'?t.value:t.value.replace(/[^\d.]/g,'')}
  persistDraft();
  if(f!=='note'){const sb=document.querySelector('.savebar .sum');if(sb){const nEx=S.draft.entries.length,n=S.draft.entries.reduce((a,x)=>a+x.sets.filter(s=>hasVal(s)).length,0);sb.innerHTML=`<b>${nEx}</b> exercise${nEx>1?'s':''} · <b>${n}</b> set${n!==1?'s':''}`}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.f==='date'||t.dataset.f==='rdate'){render()}
  if(['r','w','t','d','c'].includes(t.dataset.f)){const v=t.value;if(v!==t.value.replace(/[^\d.]/g,''))t.value=v.replace(/[^\d.]/g,'')}
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  const t=ev.target;
  if(t.id==='rNewIn'){ev.preventDefault();document.querySelector('[data-act="rNewSave"]')?.click()}
  else if(t.id==='newExIn'){ev.preventDefault();document.querySelector('[data-act="saveNewEx"]')?.click()}
  else if(t.dataset.addcat){ev.preventDefault();document.querySelector(`[data-act="addCustomSet"][data-cat="${t.dataset.addcat}"]`)?.click()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['log','progress','consistency','history'].includes(h)&&h!==S.tab){S.tab=h;render()}});

render();
Store.init();
</script>
</body>
</html>
