<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atom Log</title>
<meta name="theme-color" content="#16111a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Pacifico&family=Fredoka:wght@500;600&family=Shrikhand&family=Righteous&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bgfull,var(--bg));background-attachment:fixed;color:var(--tx);font-family:var(--bfont);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--acc-bg)}
h1,h2,h3{margin:0;font-family:var(--hfont);font-weight:700}
h3{font-family:var(--h3font);font-size:16px}
.sub{color:var(--mut);font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:30;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;height:58px}
.logo{width:34px;height:34px;flex:0 0 34px}
.hd h1{font-size:21px;flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--s1);font-size:17px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:160px;padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--mut)}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:600;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:9px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--s2)}
/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding-left:38px;border-radius:14px;height:44px}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--mut)}
.heat{display:flex;gap:8px;align-items:center}
.heat select{height:44px;border-radius:14px}
.results{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.results button{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.results b{display:grid;place-items:center;min-width:30px;height:28px;border-radius:8px;background:var(--acc-bg);color:var(--acc);font-family:var(--nfont)}
/* table */
.pt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 10px;margin:0 -2px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(var(--tw),1fr));gap:3px;min-width:calc(18 * var(--tw) + 51px)}
.pt.fit{--tw:17px}.pt.zoom{--tw:54px}
.t{position:relative;aspect-ratio:1/1.12;border-radius:7px;border:1px solid var(--tb,var(--line));background:var(--tbg,var(--s2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;line-height:1.05;overflow:hidden;transition:transform .12s,opacity .2s,box-shadow .2s;color:var(--ttx,var(--tx))}
.t:hover{transform:scale(1.08);z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.t .z{font-size:9px;opacity:.75;position:absolute;top:2px;left:4px;font-family:var(--nfont)}
.t .s{font-weight:700;font-family:var(--nfont);font-size:clamp(9px,2.3vw,19px)}
.t .n,.t .v{font-size:8.5px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt.fit .t .z,.pt.fit .t .n,.pt.fit .t .v{display:none}.pt.fit .t{border-radius:4px}
.pt.zoom .t .s{font-size:19px}
.t.dim{opacity:.18}.t.hit{box-shadow:0 0 0 2px var(--acc);z-index:1}
.t.ph{background:transparent;border-style:dashed;font-size:9px;color:var(--mut)}
.t.ph:hover{transform:none;box-shadow:none}
.gap{grid-column:1/-1;height:8px}
.glabels{display:grid;grid-template-columns:repeat(18,minmax(var(--tw),1fr));gap:3px;min-width:calc(18 * var(--tw) + 51px);margin-bottom:3px}
.glabels span{text-align:center;font-size:9.5px;color:var(--dim);font-family:var(--nfont)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.legend button{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--s1);font-size:12px}
.legend button.on{border-color:var(--acc);background:var(--acc-bg)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:8px 0 4px}
.scale .bar{flex:1;max-width:320px;height:10px;border-radius:6px}
.tip{font-size:12.5px;color:var(--mut);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.el-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.big{width:86px;height:96px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--tb);background:var(--tbg);flex:0 0 86px;position:relative}
.big .z{position:absolute;top:6px;left:9px;font-size:12px;font-family:var(--nfont);opacity:.8}
.big .s{font-size:36px;font-weight:700;font-family:var(--nfont);line-height:1}
.big .m{font-size:11px;opacity:.8;margin-top:3px}
.el-h .nm{flex:1;min-width:0}.el-h h2{font-size:26px}
.navs{display:flex;gap:6px}
.sec{margin-top:14px}.sec h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cfg{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;word-break:break-word;position:relative}
.cfg small{display:block;font-family:var(--bfont);font-size:11px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.cfg .cp{position:absolute;top:6px;right:6px}
.cfgs{display:grid;gap:8px}
.exc{background:var(--rest-bg);border:1px solid var(--rest-bd);color:var(--tx);border-radius:12px;padding:8px 12px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.fact{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.fact small{display:block;color:var(--mut);font-size:11px}.fact b{font-family:var(--nfont);font-size:16px}
.orb{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.sub-o{display:grid;justify-items:center;gap:3px}
.boxes{display:flex}
.box{width:30px;height:34px;border:1.5px solid var(--tx);display:flex;align-items:center;justify-content:center;gap:0;font-size:16px;font-weight:700;margin-left:-1.5px;background:var(--s1)}
.box:first-child{margin-left:0}
.box .u{color:var(--up)}.box .d{color:var(--lo)}
.sub-o label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut)}
.core{padding:6px 10px;border:1.5px dashed var(--line);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;align-self:center}
.trend{display:grid;gap:8px}
.tr-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.tr-row .bar{height:8px;border-radius:5px;background:var(--s2);overflow:hidden;border:1px solid var(--line)}
.tr-row .bar i{display:block;height:100%;background:var(--lo);border-radius:5px}
.tr-row b{text-align:right;font-family:var(--nfont)}
@media(max-width:520px){.tr-row{grid-template-columns:110px 1fr 80px}}
.ions{display:grid;gap:6px}
.ion{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.ion b{font-family:var(--nfont);min-width:46px}.ion code{font-family:'JetBrains Mono',monospace;font-size:13.5px}
.lewis{display:flex;gap:14px;align-items:center}
.fun{background:var(--acc-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.qn{font-family:'JetBrains Mono',monospace;font-size:14px}
/* quiz */
.q-card{text-align:center;padding:22px 16px}
.q-prompt{font-size:15px;color:var(--mut);margin-bottom:8px}
.q-big{font-family:var(--nfont);font-size:44px;font-weight:700;line-height:1.1}
.q-big.mono{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;word-break:break-word}
.q-opts{display:grid;gap:8px;margin-top:16px}
.q-opt{padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);font-size:15px;text-align:left;transition:transform .1s}
.q-opt.mono{font-family:'JetBrains Mono',monospace;font-size:13.5px}
.q-opt:active{transform:scale(.98)}
.q-opt.ok{border-color:var(--up);background:var(--up-bg)}.q-opt.bad{border-color:var(--bad);background:rgba(255,100,100,.12)}
.q-exp{margin-top:12px;font-size:13.5px;color:var(--mut)}
.q-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.score{display:flex;gap:10px;font-size:13px;color:var(--mut)}.score b{color:var(--tx);font-family:var(--nfont)}
.fc{perspective:1000px;margin:10px auto;max-width:420px}
.fc-in{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:6px}
.fc-b{transform:rotateY(180deg)}
.fc-f .s{font-size:72px;font-weight:700;font-family:var(--nfont);line-height:1}
.fc-b h2{font-size:28px}
.fc-ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* molar mass */
.mm-in{display:flex;gap:8px;flex-wrap:wrap}.mm-in input{flex:1 1 220px;font-family:'JetBrains Mono',monospace;font-size:17px;height:48px}
.mm-out{font-family:var(--nfont);font-size:34px;font-weight:700;margin:12px 0 2px}
.mm-f{font-family:'JetBrains Mono',monospace}
table.mm{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.mm th,table.mm td{white-space:nowrap;padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.mm th:first-child,table.mm td:first-child{text-align:left}
table.mm th{color:var(--mut);font-weight:600;font-size:12.5px}
.pct{display:inline-block;max-width:40px;height:6px;border-radius:3px;background:var(--lo);vertical-align:middle;margin-right:6px}
.ex-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.conv input{width:100%}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--full);color:#1b1b1b;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme-opt{padding:10px;border-radius:14px;border:2px solid var(--line);text-align:left;display:grid;gap:6px}
.theme-opt .sw{display:flex;gap:4px}.theme-opt .sw i{width:14px;height:14px;border-radius:50%}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="4.2" fill="var(--lo)"/><g fill="none" stroke="var(--acc)" stroke-width="2"><ellipse cx="20" cy="20" rx="16" ry="6.5"/><ellipse cx="20" cy="20" rx="16" ry="6.5" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="16" ry="6.5" transform="rotate(120 20 20)"/></g><circle cx="36" cy="20" r="2.2" fill="var(--up)"/></svg>
  <h1>Atom Log</h1>
  <button class="icon-btn" data-act="settings" aria-label="Settings">⚙️</button>
</div></header>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>

    if(EXC[e.z])cand.add(shortCfgMap(madelung(e.z),e.z));
    for(const d of shuffle([1,-1,2,-2,3,-3])){const z2=e.z+d;if(z2>=1&&z2<=118&&cand.size<4)cand.add(shortCfg(z2))}
    const opts=shuffle([...cand].slice(0,4));
    if(mode==='cfg')return {mode,prompt:`Noble-gas configuration of <b>${e.name}</b>`,big:e.sym,sub:`Z = ${e.z}`,opts,answer:right,mono:true,exp:`${e.name}: ${right}${EXC[e.z]?` (an exception! ${EXC_WHY[e.z]||''})`:''}`};
    const others=shuffle(P.filter(x=>x.z!==e.z&&Math.abs(x.z-e.z)<=4)).slice(0,3);const os=shuffle([e,...others]).map(x=>`${x.sym} · ${x.name}`);
    return {mode,prompt:'Which element has this configuration?',big:right,bigMono:true,opts:os,answer:`${e.sym} · ${e.name}`,exp:`${right} = ${e.name} (Z = ${e.z})`}}
  if(mode==='name'){const e=pick(P),toName=Math.random()<.5;const others=shuffle(P.filter(x=>x.z!==e.z)).slice(0,3);
    return toName?{mode,prompt:'Which element is this?',big:e.sym,opts:shuffle([e,...others]).map(x=>x.name),answer:e.name,exp:`${e.sym} = ${e.name}`}:{mode,prompt:`Symbol for <b>${e.name}</b>?`,big:'?',opts:shuffle([e,...others]).map(x=>x.sym),answer:e.sym,exp:`${e.name} = ${e.sym}`}}
  if(mode==='val'){const mg=P.filter(e=>e.z>=1);const e=pick(mg);const isVal=valence(e)!=null&&Math.random()<.5;const ans=isVal?valence(e):unpaired(cfg(e.z));
    const nums=new Set([ans]);while(nums.size<4){const n=Math.max(0,ans+pick([-3,-2,-1,1,2,3]));nums.add(n)}
    return {mode,prompt:isVal?`How many <b>valence electrons</b> does ${e.name} have?`:`How many <b>unpaired electrons</b> does ${e.name} have?`,big:e.sym,sub:shortCfg(e.z),opts:shuffle([...nums]).map(String),answer:String(ans),exp:isVal?`${e.name} is in group ${e.group}: ${ans} valence electron${ans!==1?'s':''}.`:`${shortCfg(e.z)} → ${ans} unpaired (Hund's rule).`}}
  const cands=P.filter(e=>charges(e).length&&e.z<=56);const e=pick(cands.length?cands:ELS.filter(x=>charges(x).length&&x.z<=36));const c=pick(charges(e).filter(x=>Math.abs(x)<=3).length?charges(e).filter(x=>Math.abs(x)<=3):charges(e));const {m,ne}=ionCfg(e.z,c);const right=fmtIonCfg(m,ne,S.order);
  const wrong=new Set([right]);const ne2=e.z-c;for(const d of [1,-1,2,-2])if(wrong.size<4&&ne2+d>0){const mm=madelung(ne2+d);wrong.add(fmtIonCfg(mm,ne2+d,S.order))}
  if(e.block==='d'&&c>0){const mm=madelung(e.z-c);const s=fmtIonCfg(mm,e.z-c,S.order);wrong.add(s)}
  return {mode,prompt:`Configuration of <b>${e.sym}${supCharge(c)}</b>?`,big:e.sym+supCharge(c),opts:shuffle([...wrong].slice(0,4)),answer:right,mono:true,exp:`${e.sym}${supCharge(c)}: ${right}${e.block==='d'&&c>0?' (remove the outer s electrons first!)':''}`}}
function viewQuiz(){const Q=S.quiz;if(!Q.cur)Q.cur=makeQ();const c=Q.cur;
  return `<div class="q-top"><select id="qmode">${Object.entries(QMODES).map(([k,l])=>`<option value="${k}" ${Q.mode===k?'selected':''}>${l}</option>`).join('')}</select>
    <div class="seg">${[[20,'1–20'],[36,'1–36'],[54,'1–54'],[86,'1–86'],[118,'All']].map(([v,l])=>`<button class="${Q.range===v?'on':''}" data-act="qrange" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="score"><span>Score <b>${Q.right}/${Q.total}</b></span><span>Streak <b>${Q.streak}🔥</b></span><span>Best <b>${Q.best}</b></span></div>
  <div class="card q-card"><div class="q-prompt">${c.prompt}</div><div class="q-big ${c.bigMono?'mono':''}">${c.big}</div>${c.sub?`<div class="sub" style="margin-top:4px">${esc(c.sub)}</div>`:''}
    <div class="q-opts">${c.opts.map(o=>{const st=Q.picked==null?'':o===c.answer?'ok':o===Q.picked?'bad':'';return `<button class="q-opt ${c.mono?'mono':''} ${st}" data-act="answer" data-v="${esc(o)}" ${Q.picked!=null?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
    ${Q.picked!=null?`<div class="q-exp">${Q.picked===c.answer?'✅ Correct! ':'❌ Not quite. '}${esc(c.exp)}</div><button class="btn pri" style="margin-top:12px" data-act="nextQ">Next →</button>`:''}</div>`}
/* ---------- flashcards ---------- */
function deck(){const F=S.fc;if(!F.deck||F.deck.r!==F.range){F.deck={r:F.range,list:shuffle(pool(F.range).map(e=>e.z))};F.i=0}return F.deck.list}
function viewFlash(){const F=S.fc,d=deck(),e=BYZ[d[F.i%d.length]];
  return `<div class="q-top"><div class="seg">${[[20,'1–20'],[36,'1–36'],[54,'1–54'],[86,'1–86'],[118,'All']].map(([v,l])=>`<button class="${F.range===v?'on':''}" data-act="frange" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="seg"><button class="${F.side==='sym'?'on':''}" data-act="fside" data-v="sym">Symbol first</button><button class="${F.side==='name'?'on':''}" data-act="fside" data-v="name">Name first</button></div></div>
  <div class="fc ${F.flip?'flip':''}"><div class="fc-in" data-act="flip">
    <div class="fc-f" style="${tileStyle(e)};background:var(--tbg);border-color:var(--tb)">${F.side==='sym'?`<span class="sub">Z = ${e.z}</span><span class="s">${e.sym}</span>`:`<h2 style="font-size:34px">${esc(e.name)}</h2>`}<span class="sub" style="margin-top:12px">Tap to flip</span></div>
    <div class="fc-b"><h2>${F.side==='sym'?esc(e.name):e.sym}</h2><span class="sub">${CAT[e.cat][0]} · Z = ${e.z}</span><div class="cfg" style="margin-top:8px;font-size:14px">${shortCfg(e.z)}</div>${valence(e)!=null?`<span class="sub">${valence(e)} valence e⁻ · ${unpaired(cfg(e.z))} unpaired</span>`:`<span class="sub">${unpaired(cfg(e.z))} unpaired e⁻</span>`}${EXC[e.z]?'<span class="chip">⚠️ exception</span>':''}</div>
  </div></div>
  <div class="fc-ctl"><button class="btn" data-act="fprev">‹ Prev</button><span class="sub" style="align-self:center">${F.i%d.length+1} / ${d.length}</span><button class="btn pri" data-act="fnext">Next ›</button><button class="btn ghost" data-act="fshuffle">🔀 Shuffle</button><button class="btn ghost" data-act="open" data-z="${e.z}">Details</button></div>`}
/* ---------- molar mass ---------- */
function parseFormula(f){const src=f.replace(/\s+/g,'').replace(/[·•∙⋅*]/g,'.').replace(/[₀-₉]/g,c=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(c)]);if(!src)return null;
  const parts=src.split('.');const total={};
  for(const part of parts){if(!part)continue;let i=0;const mc=part.match(/^\d+/);let mult=1;if(mc){mult=+mc[0];i=mc[0].length}
    const stack=[{}];while(i<part.length){const ch=part[i];
      if(ch==='('||ch==='['){stack.push({});i++}
      else if(ch===')'||ch===']'){if(stack.length<2)throw new Error('Extra closing bracket');const g=stack.pop();i++;const n=part.slice(i).match(/^\d+/);const k=n?+n[0]:1;if(n)i+=n[0].length;for(const [s,c] of Object.entries(g))stack[stack.length-1][s]=(stack[stack.length-1][s]||0)+c*k}
      else if(/[A-Z]/.test(ch)){let sym=ch;if(/[a-z]/.test(part[i+1]||'')&&BYSYM[(ch+part[i+1]).toLowerCase()]){sym+=part[i+1]}const e=BYSYM[sym.toLowerCase()];if(!e||e.sym!==sym)throw new Error(`"${sym}${/[a-z]/.test(part[i+sym.length]||'')?part[i+sym.length]:''}" isn't an element symbol. Check capitals (Co vs CO).`);i+=sym.length;const n=part.slice(i).match(/^\d+/);const k=n?+n[0]:1;if(n)i+=n[0].length;stack[stack.length-1][sym]=(stack[stack.length-1][sym]||0)+k}
      else throw new Error(`Unexpected "${ch}". Use element symbols, numbers, ( ) and · for hydrates.`)}
    if(stack.length!==1)throw new Error('Missing a closing bracket');for(const [s,c] of Object.entries(stack[0]))total[s]=(total[s]||0)+c*mult}
  return total}
function viewMolar(){const M=S.mm;let out='';
  if(M.f.trim()){try{const t=parseFormula(M.f);const rows=Object.entries(t).map(([s,c])=>{const e=BYSYM[s.toLowerCase()];return {e,c,sub:e.mass*c}});const mm=rows.reduce((a,r)=>a+r.sub,0);M.molar=mm;
      out=`<div class="mm-out">${mm.toFixed(3)} <span class="sub" style="font-size:16px">g/mol</span></div><div class="sub">Molar mass of <span class="mm-f">${esc(M.f.trim())}</span></div>
      <table class="mm"><tr><th>Element</th><th>Count</th><th>Atomic mass</th><th>Subtotal</th><th>Mass %</th></tr>${rows.map(r=>`<tr><td><b>${r.e.sym}</b> <span class="sub">${r.e.name}</span></td><td>${r.c}</td><td>${r.e.mass}</td><td>${r.sub.toFixed(3)}</td><td><span class="pct" style="width:${Math.max(2,r.sub/mm*40)}px"></span>${(r.sub/mm*100).toFixed(2)}%</td></tr>`).join('')}</table>
      <div class="card" style="margin-top:12px"><h3>⚖️ Grams ↔ moles</h3><div class="conv"><input type="text" inputmode="decimal" id="mmg" placeholder="grams" value="${esc(M.g)}"><span>⇄</span><input type="text" inputmode="decimal" id="mmmol" placeholder="moles" value="${esc(M.mol)}"></div><div class="sub" style="margin-top:6px">moles = grams ÷ ${mm.toFixed(3)} · grams = moles × ${mm.toFixed(3)}</div></div>`}
    catch(err){M.molar=null;out=`<div class="err">⚠️ ${esc(err.message)}</div>`}}
  return `<div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">🧮 Molar mass calculator</h3><div class="mm-in"><input type="text" id="mmf" placeholder="e.g. H2SO4, Ca(OH)2, CuSO4·5H2O" value="${esc(M.f)}" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="ex-chips">${['H2O','NaCl','C6H12O6','H2SO4','Ca(OH)2','Al2(SO4)3','CuSO4·5H2O','Fe2O3'].map(x=>`<button class="chip" data-act="mmex" data-v="${x}">${x}</button>`).join('')}</div>
    <div id="mmout">${out}</div></div>
    <div class="tip">Capitals matter: <b>Co</b> is cobalt, <b>CO</b> is carbon monoxide. Hydrates: use · or . or * (CuSO4·5H2O). Uses standard atomic masses.</div>`}
/* ---------- settings ---------- */
function viewSettings(){return `<div class="ov" data-act="close"><div class="sheet" data-stop><div class="sh-h"><h2>Settings</h2><button class="x" data-act="close">✕</button></div>
  <h3 style="margin-bottom:8px">🎨 Theme</h3><div class="themes">${Object.entries(THEMES).map(([k,t])=>{const v=themeVars(k);return `<button class="theme-opt" data-act="theme" data-v="${k}" style="background:${v.bgfull};color:${v.tx};border-color:${S.theme===k?v.acc:v.line}"><b style="font-family:${v.hfont.replace(/"/g,"'")}">${esc(t.name)}</b><span class="sw">${[v.lo,v.up,v.full,v.ca,v.rest].map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`}).join('')}</div>
  <div class="set-row"><b>Mode</b><div class="seg">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button class="${S.mode===v?'on':''}" data-act="mode" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="set-row"><div><b>Configuration order</b><div class="sub">Filling: …4s² 3d⁶ · Shell: …3d⁶ 4s²</div></div><div class="seg"><button class="${S.order==='fill'?'on':''}" data-act="order" data-v="fill">Filling</button><button class="${S.order==='shell'?'on':''}" data-act="order" data-v="shell">Shell</button></div></div>
  <div class="sub" style="margin-top:12px">Data: standard reference values (IUPAC atomic masses; CRC-style properties). Values for very heavy elements are predicted or unknown. Your textbook may round differently.</div></div></div>`}
/* ---------- render ---------- */
const TABS=[['table','🧪','Table'],['quiz','❓','Quiz'],['flash','🃏','Flashcards'],['molar','🧮','Molar mass']];
function render(){$('#nav').innerHTML=TABS.map(([k,e,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}"><span>${e}</span>${l}</button>`).join('');
  const a=$('#app');const f=document.activeElement&&document.activeElement.id,ss=f&&document.activeElement.selectionStart;
  a.innerHTML=S.tab==='table'?viewTable():S.tab==='quiz'?viewQuiz():S.tab==='flash'?viewFlash():viewMolar();
  if(f&&$('#'+f)){const el=$('#'+f);el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
function openModal(html){$('#modal').innerHTML=html;document.body.style.overflow='hidden'}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow='';S.open=null}
function openEl(z){S.open=z;openModal(viewDetail(z));try{history.replaceState(null,'','#'+BYZ[z].sym)}catch(e){}}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;if(t.dataset.act==='close'&&ev.target.closest('[data-stop]')&&!ev.target.closest('.x')&&t.classList.contains('ov'))return;
  const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case 'tab':S.tab=v;render();scrollTo({top:0});break;
    case 'open':openEl(+t.dataset.z);break;
    case 'close':if(ev.target===t||t.classList.contains('x')){closeModal();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}break;
    case 'clearQ':S.q='';render();break;
    case 'zoom':{const z=S.zoom==null?!isFitDefault():S.zoom;S.zoom=!z;LS.set('zoom',S.zoom);render();break}
    case 'cat':S.catSel=S.catSel===v?null:v;render();break;
    case 'order':S.order=v;LS.set('order',v);if(S.open)openModal(viewDetail(S.open));else if($('#modal').innerHTML)openModal(viewSettings());render();break;
    case 'copy':{const txt=v;try{navigator.clipboard.writeText(txt).then(()=>toast('Copied: '+txt)).catch(()=>toast(txt))}catch(e){toast(txt)}break}
    case 'settings':openModal(viewSettings());break;
    case 'theme':S.theme=v;LS.set('theme',v);applyTheme();openModal(viewSettings());render();break;
    case 'mode':S.mode=v;LS.set('mode',v);applyTheme();openModal(viewSettings());render();break;
    case 'answer':{const Q=S.quiz;if(Q.picked!=null)break;Q.picked=v;Q.total++;if(v===Q.cur.answer){Q.right++;Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;LS.set('best',Q.best)}if(Q.streak&&Q.streak%5===0)toast(`🔥 ${Q.streak} in a row!`)}else Q.streak=0;render();break}
    case 'nextQ':S.quiz.cur=makeQ();S.quiz.picked=null;render();break;
    case 'qrange':S.quiz.range=+v;S.quiz.cur=null;S.quiz.picked=null;render();break;
    case 'flip':S.fc.flip=!S.fc.flip;render();break;
    case 'fnext':S.fc.i++;S.fc.flip=false;render();break;
    case 'fprev':S.fc.i=Math.max(0,S.fc.i-1);S.fc.flip=false;render();break;
    case 'fshuffle':S.fc.deck=null;S.fc.flip=false;render();toast('🔀 Shuffled');break;
    case 'frange':S.fc.range=+v;S.fc.deck=null;S.fc.flip=false;render();break;
    case 'fside':S.fc.side=v;S.fc.flip=false;render();break;
    case 'mmex':S.mm.f=v;S.mm.g='';S.mm.mol='';render();break;
  }});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='q'){S.q=t.value;render()}
  else if(t.id==='mmf'){S.mm.f=t.value;S.mm.g='';S.mm.mol='';const o=$('#mmout');const tmp=document.createElement('div');tmp.innerHTML=viewMolar();o.innerHTML=tmp.querySelector('#mmout').innerHTML}
  else if(t.id==='mmg'&&S.mm.molar){S.mm.g=t.value;const g=parseFloat(t.value);S.mm.mol=isNaN(g)?'':(+(g/S.mm.molar).toPrecision(4)).toString();$('#mmmol').value=S.mm.mol}
  else if(t.id==='mmmol'&&S.mm.molar){S.mm.mol=t.value;const n=parseFloat(t.value);S.mm.g=isNaN(n)?'':(+(n*S.mm.molar).toPrecision(4)).toString();$('#mmg').value=S.mm.g}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='heat'){S.heat=t.value;S.catSel=null;render()}else if(t.id==='qmode'){S.quiz.mode=t.value;S.quiz.cur=null;S.quiz.picked=null;render()}});
document.addEventListener('keydown',ev=>{if(S.open){if(ev.key==='ArrowRight')openEl(S.open<118?S.open+1:1);else if(ev.key==='ArrowLeft')openEl(S.open>1?S.open-1:118);else if(ev.key==='Escape')closeModal();return}
  if(ev.key==='Enter'&&ev.target.id==='q'){const H=hits();if(H.length)openEl(H[0].z)}else if(ev.key==='Escape'&&$('#modal').innerHTML)closeModal();
  if(ev.key==='/'&&S.tab==='table'&&document.activeElement.tagName!=='INPUT'){ev.preventDefault();$('#q')?.focus()}});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.zoom==null)render()},200)});
applyTheme();render();
{const h=decodeURIComponent(location.hash.slice(1));const e=h&&(BYSYM[h.toLowerCase()]||BYZ[+h]);if(e)openEl(e.z)}
</script>
