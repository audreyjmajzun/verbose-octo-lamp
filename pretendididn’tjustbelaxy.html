<title>Lift Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-16%20-16%2032%2032%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22hib%22%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2215%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235d3a55%22/%3E%3Cstop%20offset%3D%22.35%22%20stop-color%3D%22%239b5a7f%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ecb6c6%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Cg%20fill%3D%22url%28%23hib%29%22%20stroke%3D%22%2316111a%22%20stroke-width%3D%22.6%22%3E%3Cpath%20transform%3D%22rotate%280%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%2872%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28144%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28216%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3Cpath%20transform%3D%22rotate%28288%29%22%20d%3D%22M0%200C-7%20-2.5%20-10.5%20-10%20-5%20-14.2C-3%20-15.6%20-1.2%20-14.4%200%20-15.4C1.2%20-14.4%203%20-15.6%205%20-14.2C10.5%20-10%207%20-2.5%200%200Z%22/%3E%3C/g%3E%3Ccircle%20r%3D%222.6%22%20fill%3D%22%234a2c45%22/%3E%3Cpath%20d%3D%22M0%200L6.5%20-8.5%22%20stroke%3D%22%23d9dba7%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22/%3E%3Cg%20fill%3D%22%23d9dba7%22%3E%3Ccircle%20cx%3D%226.8%22%20cy%3D%22-9.2%22%20r%3D%221.1%22/%3E%3Ccircle%20cx%3D%225%22%20cy%3D%22-9.6%22%20r%3D%22.8%22/%3E%3Ccircle%20cx%3D%227.9%22%20cy%3D%22-7.6%22%20r%3D%22.8%22/%3E%3Ccircle%20cx%3D%224.6%22%20cy%3D%22-7.8%22%20r%3D%22.7%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Pacifico&family=Fredoka:wght@500;600&family=Shrikhand&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16111a; --s1:#201925; --s2:#2a2131; --s3:#352a3e; --line:#3d3147; --hover:var(--hover); --tx:#f2eae7; --mut:#b5a5b3; --dim:#7f6f83; --lo:#bf96aa; --lo-bg:rgba(155,123,139,.16); --lo-bd:rgba(155,123,139,.45); --up:#a7c163; --up-bg:rgba(142,166,83,.14); --up-bd:rgba(142,166,83,.45); --full:#d9dba7; --full-bg:var(--full-bg); --full-bd:var(--full-bd); --ca:#e3a98c; --ca-bg:rgba(227,169,140,.13); --ca-bd:rgba(227,169,140,.42); --oth:#c3b6cf; --oth-c:#9d90ab; --oth-bg:var(--oth-bg); --oth-bd:rgba(157,144,171,.45); --rest:var(--rest); --rest-bg:rgba(125,106,143,.2); --rest-bg2:var(--rest-bg2); --rest-bd:var(--rest-bd); --rest-tx:#e2d0ec; --acc:#d9dba7; --acc-bg:var(--acc-bg); --on-acc:var(--on-acc); --pri:#8ea653; --pri-h:var(--pri-h); --on-pri:var(--on-pri); --focus:#9b7b8b; --under:#9b7b8b; --delta:#d7c4bd; --plum:#5d3a55; --bad:#e08a8a; --hdr:var(--hdr); --nav:var(--nav); --sbar:var(--sbar); --ov:var(--ov); --scheme:dark; --hfont:"Space Grotesk",Inter,sans-serif; --h3font:"Space Grotesk",Inter,sans-serif; --nfont:"Space Grotesk",Inter,sans-serif; --bfont:Inter,system-ui,sans-serif; --bgfull:#16111a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font:15px/1.45 var(--bfont)}
body{background:var(--bgfull);background-attachment:fixed;min-height:100vh}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx)}
h1,h2,h3{font-family:var(--hfont);margin:0;letter-spacing:-.01em;font-weight:600}
h3{font-family:var(--h3font)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:var(--hdr);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.logo h1{font-size:19px;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--pri)} .dot.warn{background:var(--focus)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.icon-btn:hover{background:var(--s2);color:var(--tx)}
main{padding:18px 0 24px}
.view-title{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px}
.view-title h2{font-size:24px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mut);margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.edit{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;justify-content:space-around;height:64px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--dim)}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:22px;height:22px}

/* log */
.top-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
input[type=date],input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--focus)}
input[type=date]{color-scheme:var(--scheme);min-height:42px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.t-Lower{background:var(--lo-bg);color:var(--lo);box-shadow:inset 0 0 0 1px var(--lo-bd)}
.seg button.on.t-Upper{background:var(--up-bg);color:var(--up);box-shadow:inset 0 0 0 1px var(--up-bd)}
.seg button.on.t-Full{background:var(--full-bg);color:var(--full);box-shadow:inset 0 0 0 1px var(--full-bd)}
.seg button.on.t-Cardio{background:var(--ca-bg);color:var(--ca);box-shadow:inset 0 0 0 1px var(--ca-bd)}
.seg button.on.t-Other{background:var(--oth-bg);color:var(--oth);box-shadow:inset 0 0 0 1px var(--oth-bd)}
.grp{margin-top:18px}
.grp-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;text-align:left}
.grp-h h3{font-size:17px}
.grp-h .bar{width:4px;height:20px;border-radius:3px}
.grp-lo .bar{background:var(--lo)} .grp-up .bar{background:var(--up)} .grp-ca .bar{background:var(--ca)}
.grp-h .meta{color:var(--mut);font-size:13px;margin-left:auto}
.chev{transition:transform .2s;color:var(--dim)} .grp.closed .chev{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.cat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grp-lo .cat{border-top:2px solid var(--lo-bd)} .grp-up .cat{border-top:2px solid var(--up-bd)} .grp-ca .cat{border-top:2px solid var(--ca-bd)}
.grp-ca .chip.on{background:var(--ca-bg);border-color:var(--ca-bd);color:var(--ca)}
.cat-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-h b{font-size:14px;font-weight:600;text-transform:capitalize}
.cnt{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--s3);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:20px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.chip:hover{color:var(--tx)}
.grp-lo .chip.on{background:var(--lo-bg);border-color:var(--lo-bd);color:var(--lo)}
.grp-up .chip.on{background:var(--up-bg);border-color:var(--up-bd);color:var(--up)}
.chip.new{border-style:dashed;color:var(--dim)}
.newex{display:flex;gap:8px;margin-top:10px}
.newex input{flex:1;min-width:0}
.btn{padding:9px 15px;border-radius:10px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-h)}
.btn.ghost{background:none;border-color:transparent;color:var(--mut)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.entry{margin-top:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px}
.e-h{display:flex;align-items:center;gap:8px}
.e-h b{flex:1;font-size:15px}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.x:hover{background:var(--s3);color:var(--bad)}
.last{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:4px 0 8px}
.last span{flex:1}
.last button{color:var(--acc);font-weight:600;font-size:12.5px;padding:2px 6px;border-radius:6px}
.set-row{display:grid;grid-template-columns:22px 1fr 14px 1fr 28px;gap:6px;align-items:center;margin-top:6px}
.set-row.eff,.set-hdr.eff{grid-template-columns:22px 1fr 14px 1fr 40px 28px}
.set-row .sn{font-size:12px;color:var(--dim);text-align:center;font-weight:600}
.set-row input{width:100%;padding:8px 10px;text-align:center;background:var(--s1)}
.set-row .mul{color:var(--dim);text-align:center;font-size:13px}
.set-hdr{display:grid;grid-template-columns:22px 1fr 14px 1fr 28px;gap:6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.e-f{display:flex;gap:8px;margin-top:10px}
.e-f input{flex:1;min-width:0;font-size:14px;padding:7px 10px;background:var(--s1)}
.c-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;align-items:end;position:relative}
.c-row label{display:flex;flex-direction:column;gap:3px}
.c-row label span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.c-row label.wide{grid-column:1/-1}
.c-row label.wide span{text-align:left}
.c-row input{width:100%;padding:8px 10px;text-align:center;background:var(--s1)}
.c-row label.wide input{text-align:left}
.c-row .sn{grid-column:1/-1;font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.c-row .x{position:absolute;right:0;top:4px}
.c-row+.c-row{border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
.remind{border-color:var(--acc);background:var(--acc-bg);color:var(--tx);flex-wrap:wrap}
.remind span{flex:1;min-width:200px}
.pill.Rest{background:var(--rest-bg);color:var(--rest-tx)}
.wo.rest{border-left:3px solid var(--rest)}
.rtag{font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--rest-bg);color:var(--rest-tx)}
.rq{margin-top:20px}
.rq h3{font-size:17px;margin-bottom:10px}
.feels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
.feel{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.feel span{font-size:24px;line-height:1.1}
.feel.on{background:var(--rest-bg2);border-color:var(--rest-bd);color:var(--tx)}
.rest-chips .chip.on{background:var(--rest-bg2);border-color:var(--rest-bd);color:var(--rest-tx)}
.seg.mode button{padding:8px 16px}
.seg.mode button.on{background:var(--s3)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.theme-opt{border:2px solid;border-radius:14px;padding:22px 10px 10px;text-align:left;min-height:96px;display:flex;align-items:flex-end}
.theme-opt.on{box-shadow:0 0 0 2px var(--acc)}
.theme-opt .tp{display:block;width:100%;border:1px solid;border-radius:10px;padding:8px 10px}
.theme-opt b{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.theme-opt .sw{display:flex;gap:4px}
.theme-opt .sw i{width:14px;height:14px;border-radius:50%;display:inline-block}
.steps-card{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding:12px 14px}
.st-ring{flex:none}
.st-main{flex:1;min-width:0}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st-top input{padding:4px 8px;font-size:14px;min-height:0}
.st-num{font-family:var(--nfont);font-size:22px;font-weight:600;margin:2px 0 6px}
.st-goal{font-family:var(--bfont);font-size:13px;color:var(--mut);font-weight:500;padding:2px 4px;border-radius:6px}
.st-goal:hover{background:var(--s2);color:var(--tx)}
.st-num span{font-family:var(--bfont);font-size:13px;color:var(--mut);font-weight:500}
.st-in{display:flex;gap:8px}
.st-in input{flex:1;min-width:0;padding:6px 10px}
.goal{margin-bottom:12px}
.g-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.g-h h3{font-size:16px}
.g-in{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.g-in input{width:84px;padding:5px 8px;text-align:center}
.g-body{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.g-stats{display:flex;gap:22px;flex-wrap:wrap}
.g-stats b{display:block;font-family:var(--nfont);font-size:22px}
.g-stats span{font-size:12.5px;color:var(--mut)}
.gbar{height:12px;background:var(--s2);border-radius:8px;overflow:hidden;margin:6px 0}
.gbar div{height:100%;border-radius:8px;transition:width .3s}
.g-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;flex-wrap:wrap}
.lg{padding:10px 0;border-bottom:1px solid var(--line)}
.lg-n{cursor:pointer}
.lg-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lg-add select{flex:2;min-width:160px}
.lg-add input{flex:1;min-width:90px}
.tile .gl{color:var(--acc)}
.tgl{width:46px;height:28px;border-radius:20px;background:var(--s3);border:1px solid var(--line);position:relative;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:all .2s}
.tgl.on{background:var(--pri);border-color:var(--pri)}
.tgl.on i{left:21px;background:var(--on-pri)}
.stepper.sm button{width:30px;height:30px;font-size:16px}
.howto{margin-top:10px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px}
.howto ol{margin:0 0 8px;padding-left:20px}
.howto li{margin-bottom:8px}
.howto code{font-size:12px;background:var(--s1);padding:2px 6px;border-radius:6px;word-break:break-all}
.howto .url{display:flex;gap:8px;align-items:center;margin:6px 0}
.howto .url code{flex:1}
.pill.rt{background:var(--acc-bg);color:var(--acc);border:1px solid var(--line)}
.tgt{font-size:12.5px;color:var(--acc);font-weight:600;margin-top:2px}
.rt-card .wo-h{flex-wrap:wrap}
.rt-ord{display:flex;gap:2px;margin-left:auto}
.rt-items{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.rt-items span{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
.rt-items i{font-style:normal;color:var(--mut);font-size:12px}
.rt-act{display:flex;gap:8px;flex-wrap:wrap}
.rt-item{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rt-ih{display:flex;align-items:center;gap:6px}
.rt-ih b{flex:1}
.rt-ih .sub{text-transform:capitalize;margin-right:6px}
.rt-f{display:grid;grid-template-columns:80px 1fr 1.6fr;gap:8px;margin-top:8px}
.rt-f label{display:flex;flex-direction:column;gap:3px}
.rt-f label span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.rt-f input{padding:7px 9px;background:var(--s1);min-width:0}
.rt-f label.wide{grid-column:span 1}
@media(max-width:560px){.rt-f{grid-template-columns:70px 1fr}.rt-f label.wide{grid-column:1/-1}}
.mini{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--s3);color:var(--mut);border:1px solid var(--line)}
.mini:hover{color:var(--tx)}
.effb{height:34px;border-radius:9px;background:var(--s1);border:1px solid var(--line);font-size:16px;color:var(--dim)}
.effb.e1{background:var(--up-bg);border-color:var(--up-bd)}
.effb.e2{background:var(--full-bg);border-color:var(--full-bd)}
.effb.e3{background:var(--ca-bg);border-color:var(--ca-bd)}
.effh{letter-spacing:1px;font-size:12px}

.cyc-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}.cyc-tbl th,.cyc-tbl td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}.cyc-tbl td:first-child,.cyc-tbl th:first-child{text-align:left}.cyc-tbl th{color:var(--mut);font-weight:600}
.bud-one{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.bud-code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--s1);border:1px solid var(--line);color:var(--mut)}
.bud-lane{display:grid;grid-template-columns:64px minmax(0,1fr) 54px;align-items:center;gap:8px;margin-top:8px;font-size:12.5px}.bud-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.bud-v{text-align:right;font-weight:700}
.bud-track{position:relative;height:10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);background-image:linear-gradient(90deg,transparent 96%,var(--acc) 96%)}
.bud-track i{position:absolute;top:50%;transform:translate(-50%,-55%);font-style:normal;font-size:18px;transition:left .6s}
.bud-lane.me .bud-track{background-color:var(--lo-bg)}.bud-lane.them .bud-track{background-color:var(--up-bg)}
.bud-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.bud-btns input{flex:1;min-width:120px}
.bud-new summary{cursor:pointer;font-weight:600;color:var(--acc);margin-top:6px}.bud-form{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bud-form input,.bud-form select{flex:1;min-width:90px}
.cb-card{border-color:var(--up-bd);background:linear-gradient(135deg,var(--up-bg),var(--s1))}
.cb-items{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.cb-items span{font-size:12.5px;padding:4px 9px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
.cb-btns{display:flex;gap:8px;flex-wrap:wrap}
.pet-card.tod-dawn .pet-scene{background:linear-gradient(180deg,#ffd6c9 0%,#fbe7c6 45%,var(--s1) 100%)}
.pet-card.tod-dusk .pet-scene{background:linear-gradient(180deg,#ff9a76 0%,#ffcf91 40%,var(--s1) 100%)}
.pet-card.tod-night .pet-scene{background:linear-gradient(180deg,#141a3a 0%,#2b2f5e 55%,var(--s1) 100%)}
.pet-card.tod-night .pet-sea{filter:brightness(.6) saturate(.8)}.pet-card.tod-night .pet-sand{filter:brightness(.7)}
.pet-scene .star{position:absolute;color:#fff7c2;font-style:normal;font-size:9px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.beach-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.beach-fx i{position:absolute;top:-16px;font-style:normal;font-size:12px;animation:bfall linear infinite;opacity:.85}
@keyframes bfall{to{transform:translate(18px,170px) rotate(200deg)}}
.pet-scene .bat{position:absolute;font-style:normal;font-size:15px;animation:batfly 3s ease-in-out infinite}.pet-scene .bat.b2{animation-delay:1.2s}
@keyframes batfly{50%{transform:translate(14px,-6px) scale(.9)}}
.fri13 .wally .pet-e{filter:grayscale(.6) brightness(1.15);animation:spook 2s ease-in-out infinite}@keyframes spook{50%{opacity:.6;transform:translateY(-3px)}}
.pc-btn{float:right;margin-left:6px}.pc-btn.new{border-color:var(--acc);color:var(--acc);animation:pulse 1.6s infinite}

.pc-stamp{position:absolute;top:10px;right:12px;width:46px;height:52px;display:grid;place-items:center;font-size:26px;border:2px dashed #e75a8d;border-radius:4px;background:#fff}
.pc-txt{font-size:19px;line-height:1.35;padding-right:56px;min-height:60px}.pc-from{margin-top:12px;font-size:17px;font-weight:700}.pc-date{font-size:12px;color:#8a7a86;margin-top:2px;font-family:var(--bfont)}
.pc-old{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.pc-old>span{font-size:22px}
.fish-ov{position:fixed;inset:0;z-index:80;background:var(--ov);display:grid;place-items:center;padding:16px}
.fish-box{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;justify-items:center;max-width:400px}
.fish-h{display:flex;gap:10px;align-items:center;width:100%}.fish-h b{flex:1}.fish-h .tb{padding:5px 10px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
#fishC{border-radius:12px;display:block}
.games-card.locked{opacity:.85}.game-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.game-t{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;gap:2px;justify-items:center;text-align:center;font-size:12px;color:var(--mut)}
.game-t b{color:var(--tx);font-size:13px}.game-t .ge{font-size:24px}.game-t.done{border-color:var(--up-bd);background:var(--up-bg)}
.games-card.locked .game-t{filter:grayscale(.5)}
.maze-wrap{display:flex;justify-content:center;touch-action:none}.maze-svg{width:100%;max-width:300px;background:var(--s2);border-radius:12px;padding:4px}
.maze-pad{display:grid;justify-items:center;gap:6px;margin-top:10px}.maze-pad div{display:flex;gap:6px}.maze-pad button{width:56px;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:18px}
.game-won{text-align:center;font-weight:700;font-size:16px;margin-top:12px;color:var(--acc)}
.xw-grid{display:grid;gap:2px;margin:0 auto}.xw-blk{aspect-ratio:1}.xw-c{position:relative;aspect-ratio:1;background:var(--s2);border:1.5px solid var(--line);border-radius:5px}
.xw-c i{position:absolute;top:1px;left:3px;font-size:8.5px;font-style:normal;color:var(--mut);pointer-events:none}
.xw-c input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:800;font-size:16px;padding:0;color:var(--tx);text-transform:uppercase;border-radius:5px}

.xw-clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:12.5px}.xw-clues h4{margin:0 0 4px}.xw-clues ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}.xw-clues b{color:var(--acc);margin-right:3px}
.scr-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.scr-row input{flex:1;min-width:110px;text-transform:uppercase;font-weight:700;letter-spacing:.1em}
.scr-s{display:flex;gap:3px;width:100%}.scr-s span{width:28px;height:30px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);border-radius:7px;font-weight:800}
.scr-row.ok .scr-s span{background:var(--up-bg);border-color:var(--up-bd)}.scr-ok{color:var(--up);font-size:18px}.scr-h{width:100%}
.acc-pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.acc-sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}.acc-sw.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--s1) inset}

function hx(c){c=String(c).trim();if(c[0]!=='#')return null;if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}

function nudgeFor(e,last){
  if(!last)return null;
  const ss=last.sets.filter(s=>num(s.r)!=null&&num(s.w)!=null);if(ss.length<2)return null;
  const w=Math.max(...ss.map(s=>num(s.w)));const top=ss.filter(s=>num(s.w)===w);if(top.length<2)return null;
  let goalR=null;const m=String(e.target||'').match(/(\d+)\s*(?:-|–|to)\s*(\d+)/);if(m)goalR=+m[2];else if(/^\s*\d+\s*$/.test(e.target||''))goalR=+e.target;

  const hardish=top.some(s=>+s.e===3);
  if(goalR!=null?minR<goalR:minR<12)return null;
  if(hardish&&goalR==null)return null;
  const step=unit()==='kg'?2.5:(['squat','hinge'].includes(e.cat)&&w>=95?10:5);
  return {w:w+step,why:goalR!=null?`You hit ${goalR}+ reps on every set at ${fw(w)} last time.`:`${minR}+ reps on every set at ${fw(w)} last time.`};
}
/* plate calculator */
function platesFor(total,bar,u){
  const plates=u==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
  let side=(total-bar)/2;if(side<0)return null;const out=[];
  for(const p of plates){while(side>=p-1e-9){out.push(p);side-=p}}
  return {out,rem:Math.round(side*2*100)/100};
}
const PLATE_COL={45:'#c0392b',25:'#2e86de',35:'#f1c40f',10:'#27ae60',5:'#ecf0f1',2.5:'#95a5a6',20:'#2e86de',15:'#f1c40f',1.25:'#bdc3c7'};
function renderPlates(){

  if(!bars.includes(pc.bar))pc.bar=bars[0];
  const tw=num(pc.w),r=tw!=null?platesFor(tw,pc.bar,u):null;
  let vis='';
  if(r){const hs=[...r.out].reverse().map(p=>{const hgt=Math.round(40+ (p/(u==='kg'?25:45))*70);const wd=p>=10?14:9;return `<span class="pl" style="height:${hgt}px;width:${wd}px;background:${PLATE_COL[p]||'#999'}" title="${p}"></span>`}).join('');
    vis=`<div class="pl-vis"><span class="bar-end"></span>${hs}<span class="bar-mid"></span></div><div class="pl-list">${r.out.length?`Each side: <b>${r.out.map(fw).join(' + ')}</b>`:'Just the bar!'}${r.rem?` <span class="sub">(${fw(r.rem)} ${u} left over — closest you can load)</span>`:''}</div>`}
  else if(tw!=null)vis=`<div class="sub" style="margin-top:10px">That's lighter than the bar.</div>`;
  $('#modal').innerHTML=`<div class="ov" data-act="closeModal"><div class="sheet" data-stop="1" style="max-width:460px"><div class="sh-h"><h2>🏋️ Plate calculator</h2><button class="x" data-act="closeModal">✕</button></div>
    <div class="top-row"><label class="field"><span>Total weight (${u})</span><input type="text" inputmode="decimal" id="plW" value="${esc(pc.w)}" style="width:120px"></label>
    <div class="field"><span>Bar</span><div class="seg">${bars.map(b=>`<button class="${pc.bar===b?'on':''}" data-act="plBar" data-v="${b}">${b}</button>`).join('')}</div></div></div>${vis}</div></div>`;
  S.modal='plates';
  const inp=$('#plW');inp.oninput=()=>{pc.w=inp.value.replace(/[^\d.]/g,'');clearTimeout(pc.t);pc.t=setTimeout(()=>{const pos=inp.selectionStart;renderPlates();const n=$('#plW');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}},350)};

  add(s){if(!this.end)return;this.end+=s*1000;this.dur=Math.max(5,this.dur+s);if(s>0&&this.end-Date.now()>240000&&onceToday('turtle'))setTimeout(()=>critter('turtle'),300);if(this.end<Date.now()+1000)this.end=Date.now()+1000;this.done=false;this.tick()},
  stop(){clearInterval(this.iv);this.iv=null;this.end=0;this.done=false;const el=$('#timer');el.classList.add('hidden');el.innerHTML='';try{document.title='Lift Log'}catch(e){}},
  unlock(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
  beep(){if(!S.profile.rest.sound)return;try{const c=this.ctx;if(!c)return;[0,0.22,0.44].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i===2?1046:784;o.connect(g);g.connect(c.destination);const s=c.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.35,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);o.start(s);o.stop(s+0.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}},
  tick(){

/* ----- Build me a workout ----- */
const FOCUS={glutes:['🍑 Glutes',['glutes']],legs:['🦵 Legs',['quads','hamstrings','glutes','calves','inner thighs']],upper:['💪 Upper',['chest','shoulders','upper back','lats','biceps','triceps']],push:['🫸 Push',['chest','shoulders','triceps']],pull:['🫷 Pull',['upper back','lats','biceps']],core:['🔥 Core',['abs']],full:['⚡ Full body',null],neglected:['🧭 Neglected',null]};
const COMPOUND=new Set(['squat','hinge','lunge','hpush','vpush','hpull','vpull']);
function buildWorkout(focus,mins){
  const nEx={20:3,30:4,45:5,60:6}[mins]||4;
  const usage={};for(const w of S.workouts)for(const e of w.entries||[])usage[e.ex]=(usage[e.ex]||0)+1;
  const ms=muscleSets(new Date());
  let pool=[];for(const c of CATS){if(c.group==='Cardio')continue;for(const ex of exercisesFor(c.key)){if(injuryFlag(c.key,ex))continue;pool.push({cat:c.key,ex,mus:musclesOf({cat:c.key,ex})})}}
  let target=FOCUS[focus]?.[1];
  if(focus==='neglected'){target=MUSC.slice().sort((a,b)=>ms[a]-ms[b]).slice(0,4)}
  const score=x=>(usage[x.ex]?2+Math.min(3,usage[x.ex]/3):0)+Math.random()*2.5+(COMPOUND.has(x.cat)?1:0)-(x.mus.reduce((a,m)=>a+(ms[m]||0),0)/20);
  let picks=[];
  const SLOTS={full:[['squat','lunge'],['hinge'],['hpush','vpush'],['hpull','vpull'],['core','carry'],['liso','uiso']],
    glutes:[['hinge'],['lunge','squat'],['hinge'],['liso'],['lunge','squat','hinge'],['liso','hinge']],
    legs:[['squat'],['hinge'],['lunge'],['liso'],['squat','lunge'],['liso','hinge']],
    upper:[['hpush'],['hpull'],['vpush'],['vpull'],['uiso'],['uiso']],
    push:[['hpush'],['vpush'],['hpush'],['uiso'],['uiso'],['vpush']],
    pull:[['vpull'],['hpull'],['hpull','vpull'],['uiso'],['uiso'],['hpull']],
    core:[['core'],['core'],['carry'],['core'],['core'],['carry']]};
  const cand=focus==='full'?pool:pool.filter(x=>x.mus.some(m=>target.includes(m)));
  const ranked=cand.map(x=>({x,s:score(x)})).sort((a,b)=>b.s-a.s).map(o=>o.x);
  if(SLOTS[focus]){
    for(const sl of SLOTS[focus]){if(picks.length>=nEx)break;const c=ranked.find(x=>sl.includes(x.cat)&&!picks.includes(x));if(c)picks.push(c)}
  }else{
    const perCat={};for(const x of ranked){if(picks.length>=nEx)break;if(perCat[x.cat])continue;perCat[x.cat]=1;picks.push(x)}
  }
  for(const x of ranked){if(picks.length>=nEx)break;if(!picks.includes(x))picks.push(x)}

/* ----- Confetti ----- */
function celebrate(power=1){
  if(!S.profile.extras.confetti)return;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cols=[COLORS.Lower,COLORS.Upper,COLORS.Full,COLORS.Cardio,T.acc,T.rest];
  const N=Math.round(110*power),P=[];
  for(let i=0;i<N;i++){const side=i%2;P.push({x:side?W*0.85:W*0.15,y:H*0.75,vx:(side?-1:1)*(2+Math.random()*6),vy:-(9+Math.random()*9),r:4+Math.random()*6,a:Math.random()*6.28,va:(Math.random()-.5)*.3,col:cols[i%cols.length],petal:Math.random()<.55})}
  let t0=performance.now();
  (function fr(t){const dt=Math.min(32,t-t0)/16;t0=t;c.clearRect(0,0,W,H);let alive=0;
    for(const p of P){p.vy+=0.32*dt;p.vx*=0.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;if(p.y<H+20)alive++;
      c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.col;
      if(p.petal){c.beginPath();c.ellipse(0,0,p.r*0.6,p.r*1.2,0,0,6.28);c.fill()}else c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore()}
    if(alive)requestAnimationFrame(fr);else cv.remove()})(t0);
  setTimeout(()=>cv.remove(),6000);
}

const LEVELS=[[0,'Seedling','🌱'],[300,'Sprout','🌿'],[800,'Bud','🌷'],[1600,'Bloom','🌸'],[2800,'Hibiscus','🌺'],[4500,'Ivy','🍃'],[7000,'Wildflower','🌼'],[10000,'Garden Guardian','🪴'],[14000,'Botanical Beast','🌳'],[19000,'Ivy Queen','👑']];

  const b={};let sets=0;for(const w of S.workouts)for(const e of w.entries||[])if(!isCardioCat(e.cat))sets+=(e.sets||[]).filter(hasVal).length;
  b['Sets lifted']=[sets,sets*10];
  const cm=Math.round(cardioRows().reduce((a,r)=>a+(r.t||0),0));b['Cardio minutes']=[cm,cm];
  b['Rest days']=[S.rest.length,S.rest.length*25];

  const sg=S.steps.filter(s=>s.n>=(S.profile.goals.steps||8000)).length;if(S.profile.stepsOn||sg)b['Step goals hit']=[sg,sg*20];

/* ----- Forecasts ----- */
function trendFor(ex){
  const pts=seriesFor(ex).filter(r=>r.top!=null).map(r=>({x:parse(r.date).getTime()/864e5,y:r.top}));
  if(pts.length<3)return null;const span=pts[pts.length-1].x-pts[0].x;if(span<14)return null;
  const use=pts.slice(-10),n=use.length,mx=use.reduce((a,p)=>a+p.x,0)/n,my=use.reduce((a,p)=>a+p.y,0)/n;
  let num_=0,den=0;for(const p of use){num_+=(p.x-mx)*(p.y-my);den+=(p.x-mx)**2}
  const slope=den?num_/den:0,last=pts[pts.length-1];return {slope,base:my+slope*(last.x-mx),lastX:last.x,best:Math.max(...pts.map(p=>p.y))};
}
function forecastLine(ex){
  const t=trendFor(ex);if(!t)return `<div class="fc">📈 Log this lift a few more times over a couple of weeks to see a forecast.</div>`;
  if(t.slope<=0.01)return `<div class="fc">📈 You're holding steady around ${fw(Math.round(t.base))} ${esc(unit())}. Try a "go up" week to break through!</div>`;
  const g=liftGoalFor(ex);const in8=Math.round((t.base+t.slope*56)/2.5)*2.5;
  let s=`📈 At this rate: about <b>${fw(in8)} ${esc(unit())}</b> by ${fmtD(iso(addDays(new Date(),56)))}`;
  if(g&&t.best<g.target){const days=Math.ceil((g.target-t.base)/t.slope);s+=` · on pace for your ${fw(g.target)} goal around <b>${fmtD(iso(addDays(new Date(),Math.max(1,days))))}</b>`}
  return `<div class="fc">${s}. Keep stacking sessions!</div>`;
}
function goalForecast(g){const t=trendFor(g.ex);if(!t||t.slope<=0.01)return '';const days=Math.ceil((g.target-t.base)/t.slope);if(days<=0)return '📈 any day now · ';const d=iso(addDays(new Date(),days));return `📈 on pace for ${fmtD(d)}${g.by?(d<=g.by?' ✓':' (a bit after your date)'):''} · `}

const r05=x=>Math.round(x*2)/2,r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
function unitChoice(kind,to){

  const apply=()=>{if(kind==='w')S.profile.unit=to;else S.profile.lunit=to;Store.saveProfile();if(S.modal==='settings')renderSettings();render()};
  if(!S.profile.extras.convert){apply();return}
  const lab=kind==='w'?`${cur} → ${to}`:`${cur} → ${to}${to==='cm'?' (and mi → km)':' (and km → mi)'}`;
  S.modal='convert';
  $('#modal').innerHTML=`<div class="ov" data-act="closeModal"><div class="sheet" data-stop="1" style="max-width:440px"><h2 style="font-size:18px">Convert your data ${lab}?</h2><div class="sub">"Convert all" changes every number you've logged (${kind==='w'?'lift weights, body weight, lift goals':'tape measurements, body goals, cardio distances'}). "Label only" just changes the unit name.</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" id="cvLabel">Label only</button><button class="btn pri" id="cvAll">Convert all</button></div></div></div>`;
  $('#cvLabel').onclick=()=>{closeModal();apply()};
  $('#cvAll').onclick=async()=>{closeModal();toast('Converting…');try{await convertAll(kind,cur,to);apply();toast('✓ Converted everything to '+to)}catch(e){toast(errMsg(e))}};
}
async function convertAll(kind,from,to){
  const f=kind==='w'?(to==='kg'?0.45359237:2.20462262):(to==='cm'?2.54:1/2.54);
  const fd=to==='cm'?1.609344:1/1.609344;
  for(const w of [...S.workouts]){let ch=false;const doc={...clone(w)};delete doc.id;
    for(const e of doc.entries||[])for(const s of e.sets||[]){
      if(kind==='w'&&!isCardioCat(e.cat)&&num(s.w)!=null){s.w=r05(num(s.w)*f);ch=true}
      if(kind==='l'&&isCardioCat(e.cat)&&num(s.d)!=null){s.d=r2(num(s.d)*fd);ch=true}}
    if(ch)await Store.saveWorkout(w.id,doc)}
  for(const m of [...S.measures]){const vals={...(m.vals||{})};let ch=false;for(const k of Object.keys(vals)){const isW=MMAP[k]?.w;if((kind==='w'&&isW)||(kind==='l'&&!isW)){vals[k]=r1(num(vals[k])*f);ch=true}}
    if(ch)await Store.saveMeasure(m.id,{date:m.date,vals,updatedAt:Date.now()})}
  if(kind==='w'){S.profile.goals.lifts=S.profile.goals.lifts.map(g=>({...g,target:r05(g.target*f)}));if(S.profile.goals.body?.weight)S.profile.goals.body.weight=r1(S.profile.goals.body.weight*f)}
  else{const b={...(S.profile.goals.body||{})};for(const k of Object.keys(b))if(k!=='weight')b[k]=r1(b[k]*f);S.profile.goals.body=b}
  // keep drafts consistent
  for(const e of S.draft.entries)for(const s of e.sets){if(kind==='w'&&!isCardioCat(e.cat)&&num(s.w)!=null)s.w=String(r05(num(s.w)*f));if(kind==='l'&&isCardioCat(e.cat)&&num(s.d)!=null)s.d=String(r2(num(s.d)*fd))}
  persistDraft();Store.saveProfile();
}

function glowCard(){

  const A=[first,iso(addDays(parse(first),29))],B=[iso(addDays(new Date(),-29)),t];
  const inR=(d,r)=>d>=r[0]&&d<=r[1];
  const stat=r=>{const W=S.workouts.filter(w=>inR(w.date,r));let vol=0;for(const w of W)for(const e of w.entries||[])for(const s of e.sets||[]){const a=num(s.r),b=num(s.w);if(a!=null&&b!=null)vol+=a*b}
    const lo=S.loose.filter(x=>x.v&&inR(x.date,r)),wa=S.water.filter(x=>x.n&&inR(x.date,r));
    return {w:W.length,vol,c:Math.round(cardioRows().filter(x=>inR(x.date,r)).reduce((s,x)=>s+(x.t||0),0)),lo:lo.length?lo.reduce((s,x)=>s+x.v,0)/lo.length:null,wa:wa.length?wa.reduce((s,x)=>s+x.n,0)/wa.length:null}};
  const a=stat(A),b=stat(B);
  const cnt={};for(const w of S.workouts)for(const e of w.entries||[])if(!isCardioCat(e.cat))cnt[e.ex]=(cnt[e.ex]||0)+1;
  const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0]?.[0];
  const best=(ex,r)=>{let m=null;for(const w of S.workouts)if(inR(w.date,r))for(const e of w.entries||[])if(e.ex===ex)for(const s of e.sets||[]){const x=num(s.w);if(x!=null&&(m==null||x>m))m=x}return m};

}

function findExIn(text){const idx=knownIndex(),n=normName(text);const direct=matchEx(n,idx);if(direct)return direct;let best=null;
  const cands=[...Object.values(idx).map(v=>[normName(v.ex),v]),...Object.entries(ALIAS).filter(([a,b])=>idx[squash(b)]).map(([a,b])=>[a,idx[squash(b)]])];
  for(const [nm,v] of cands){if(nm.length<3)continue;if(new RegExp(`(^|\\s)${nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(s|es)?(\\s|$)`).test(n)&&(!best||nm.length>best[0].length))best=[nm,v]}return best?best[1]:null}
function quickAdd(text){
  const parts=String(text||'').split(/\b(?:and then|then|next|also)\b|[,;\n]|\.\s/i).map(s=>s.trim()).filter(Boolean);let added=[],miss=[];
  for(const part of parts){const p=parseLine(part);const k=findExIn(p.name)||findExIn(part);if(!k){if(p.name)miss.push(p.name);continue}
    const cardio=isCardioCat(k.cat);let e=S.draft.entries.find(x=>x.ex===k.ex);

    else{const n=Math.min(10,p.sets||1),r=p.reps?String(p.reps).split('-')[0]:'';for(let i=0;i<n;i++)e.sets.push({r,w:p.w!=null?String(p.w):''})}

function cycleDay(d){const st=(S.profile.cycle.starts||[]).filter(x=>x<=d).sort();const s=st[st.length-1];if(!s)return null;const n=daysBetween(s,d)+1;return n<=45?n:null}
function cyclePatterns(){
  const C=S.profile.cycle;if((C.starts||[]).length<2)return '<div class="sub">Log at least two period starts (about one full cycle) along with your workouts, and patterns show up here.</div>';
  const first=[...C.starts].sort()[0],B=[['Days 1–7',1,7],['Days 8–14',8,14],['Days 15–21',15,21],['Day 22+',22,45]].map(b=>({l:b[0],a:b[1],z:b[2],days:0,w:0,rt:[],lo:[],pr:0}));
  const wd={};for(const w of S.workouts)(wd[w.date]=wd[w.date]||[]).push(w);const lo={};for(const l of S.loose)if(l.v)lo[l.date]=l.v;const prd=new Set(computePRs().prs.map(p=>p.date));
  for(let d=parse(first);iso(d)<=todayISO();d=addDays(d,1)){const k=iso(d),n=cycleDay(k);if(!n)continue;const b=B.find(x=>n>=x.a&&n<=x.z);if(!b)continue;b.days++;
    for(const w of wd[k]||[]){b.w++;if(w.rating)b.rt.push(w.rating)}if(lo[k])b.lo.push(lo[k]);if(prd.has(k))b.pr++}
  const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length):null;
  return `<table class="cyc-tbl"><tr><th></th><th>Workouts / wk</th>${S.profile.extras.rating?'<th>Avg ★</th>':''}${S.profile.extras.loose?'<th>Loose</th>':''}<th>PR days</th></tr>${B.filter(b=>b.days).map(b=>`<tr><td>${b.l}</td><td>${(b.w/b.days*7).toFixed(1)}</td>${S.profile.extras.rating?`<td>${avg(b.rt)?.toFixed(1)??'—'}</td>`:''}${S.profile.extras.loose?`<td>${avg(b.lo)?.toFixed(1)??'—'}</td>`:''}<td>${b.pr}</td></tr>`).join('')}</table><div class="sub" style="margin-top:6px">Just your own history, grouped by cycle day. More cycles logged means clearer patterns. Everyone's different!</div>`;
}

function restRun(){let n=0;const wd=new Set(S.workouts.map(w=>w.date)),rd=new Set(S.rest.map(r=>r.date));let d=new Date();if(!rd.has(iso(d))&&!wd.has(iso(d)))d=addDays(d,-1);
  for(;;d=addDays(d,-1)){const k=iso(d);if(wd.has(k)||!rd.has(k))break;n++;if(n>60)break}return n}
function gapBefore(date){const prev=S.workouts.filter(w=>w.date<date).map(w=>w.date).sort().pop();return prev?daysBetween(prev,date):null}
function easyWorkout(){
  const usage={};for(const w of S.workouts)for(const e of w.entries||[])usage[e.ex]=(usage[e.ex]||0)+1;
  const slots=[[['squat','lunge'],'goblet squat','squat'],[['hinge'],'glute bridge','hinge'],[['hpull','vpull','hpush'],'dumbbell row','hpull'],[['core'],'dead bug','core']];
  const items=slots.map(([cats,fb,fc])=>{let best=null;for(const c of cats)for(const ex of exercisesFor(c)){if(injuryFlag(c,ex))continue;if(!best||(usage[ex]||0)>(usage[best.ex]||0))best={cat:c,ex}}if(!best||!usage[best.ex])best={cat:fc,ex:fb};return {cat:best.cat,ex:best.ex,sets:2,reps:best.cat==='core'?'10':'10-12',note:'Light and easy. Leave a few reps in the tank.'}});
  items.push({cat:'cout',ex:'walking',sets:1,reps:'10 min',note:'Easy pace'});
  return {id:'rt_easy',name:'🌱 Easy comeback',type:'Full body',items};
}
function comebackCard(){
  if(!S.profile.extras.comeback||activePause())return '';const t=todayISO();if(S.workouts.some(w=>w.date===t))return '';
  try{if(localStorage.getItem('liftlog_cbskip_'+t))return ''}catch(e){}

function makeMaze(cols,rows,rnd){const c=[...Array(rows)].map(()=>Array(cols).fill(15)),seen=[...Array(rows)].map(()=>Array(cols).fill(false));const st=[[0,0]];seen[0][0]=true;

function makeCross(rnd){
  for(let attempt=0;attempt<30;attempt++){const pool=shuffleR(XWORDS,rnd).filter(([w])=>w.length<=9);const G={},D={},placed=[];
    const put=(w,r,c,dr,dc,clue)=>{for(let i=0;i<w.length;i++){const k=`${r+dr*i},${c+dc*i}`;G[k]=w[i];(D[k]=D[k]||[]).push(dr?'d':'a')}placed.push({w,r,c,dr,dc,clue})};
    const [w0,cl0]=pool[0];put(w0,0,0,0,1,cl0);
    const fits=(w,r,c,dr,dc)=>{if(G[`${r-dr},${c-dc}`]||G[`${r+dr*w.length},${c+dc*w.length}`])return -1;let x=0;const dir=dr?'d':'a';
      for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i,k=`${rr},${cc}`;if(G[k]){if(G[k]!==w[i]||D[k].includes(dir))return -1;x++;continue}if(G[`${rr+dc},${cc+dr}`]||G[`${rr-dc},${cc-dr}`])return -1}
      return x>0&&x<w.length?x:-1};
    const bbox=extra=>{let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;for(const k of [...Object.keys(G),...extra]){const [r,c]=k.split(',').map(Number);r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)}return [r1-r0+1,c1-c0+1]};
    for(const [w,clue] of pool.slice(1)){if(placed.length>=6)break;const opts=[];
      for(const k of Object.keys(G)){const [r,c]=k.split(',').map(Number);for(let i=0;i<w.length;i++){if(w[i]!==G[k])continue;for(const [dr,dc] of [[0,1],[1,0]]){const sr=r-dr*i,sc=c-dc*i;if(fits(w,sr,sc,dr,dc)>0){const cells=[...Array(w.length)].map((_,j)=>`${sr+dr*j},${sc+dc*j}`);const [h,wd]=bbox(cells);if(h<=10&&wd<=10)opts.push([sr,sc,dr,dc])}}}}
      if(opts.length){const o=opts[Math.floor(rnd()*opts.length)];put(w,o[0],o[1],o[2],o[3],clue)}}
    if(placed.length<5)continue;
    let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;for(const k of Object.keys(G)){const [r,c]=k.split(',').map(Number);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r);c1=Math.max(c1,c)}

    const starts=[...new Set(words.map(p=>`${p.r},${p.c}`))].sort((a,b)=>{const [ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc});
    words.forEach(p=>p.n=starts.indexOf(`${p.r},${p.c}`)+1);
    return {rows:r1-r0+1,cols:c1-c0+1,sol,words,nums:Object.fromEntries(starts.map((k,i)=>[k,i+1])),fill:{},dir:'a'}}
  return null}

function repRange(e){const m=String(e.target||'').match(/(\d+)\s*(?:-|–|to)\s*(\d+)/);if(m)return [+m[1],+m[2]];const n=parseInt(e.target);return n?[n,n]:null}
function smartFor(e,last){
  if(!last)return null;const ss=last.sets.filter(s=>num(s.r)!=null&&num(s.r)>0);if(!ss.length)return null;
  const range=repRange(e),nSets=parseInt(e.tsets)||Math.min(5,Math.max(2,ss.length)),u=unit();
  const wsets=ss.filter(s=>num(s.w)!=null&&num(s.w)>0);
  if(!wsets.length){const top=Math.max(...ss.map(s=>num(s.r)));const r=range?Math.min(range[1],top+1):top+1;return {w:null,r,n:nSets,why:`${top} reps last time. Aim for ${r} today.`}}
  const w=Math.max(...wsets.map(s=>num(s.w))),top=wsets.filter(s=>num(s.w)===w),minR=Math.min(...top.map(s=>num(s.r))),maxR=Math.max(...top.map(s=>num(s.r)));
  const effs=top.map(s=>+s.e||0).filter(Boolean),hard=effs.includes(3),easy=effs.length>0&&effs.every(x=>x===1);
  const lower=['squat','hinge','lunge'].includes(e.cat),iso=['liso','uiso'].includes(e.cat);
  let step=u==='kg'?(lower&&w>=40?5:2.5):(lower&&w>=95?10:5);if(easy&&!iso)step*=2;
  const rnd=u==='kg'?2.5:5,R=x=>Math.max(rnd,Math.round(x/rnd)*rnd),feel=hard?'felt hard':easy?'felt easy':effs.length?'felt solid':'';
  const last_=`${top.length>1?`${top.length}×`:''}${minR===maxR?minR:minR+'–'+maxR} at ${fw(w)}${feel?`, ${feel}`:''}`;
  if(injuryFlag&&injuryFlag(e.cat,e.ex))return {w,r:range?range[0]:minR,n:nSets,why:`Last: ${last_}. Injury note on this one, so keep it the same and go easy.`};
  const rg=range||(iso?[10,15]:null);
  if(rg){const [lo,hi]=rg;const range=rg;
    if(minR>=hi&&!hard)return {w:w+step,r:lo,n:nSets,up:true,why:`Last: ${last_}. ${lo===hi?`You hit all ${hi} reps`:`You hit the top of your ${lo}–${hi} range`}, so go up!`};
    if(minR>=hi&&hard)return {w,r:hi,n:nSets,why:`Last: ${last_}. Own it once more at this weight before going up.`};
    if(minR>=lo)return {w,r:Math.min(hi,minR+1),n:nSets,why:`Last: ${last_}. Same weight, try for one more rep.`};
    return hard?{w:R(w*.93),r:lo,n:nSets,why:`Last: ${last_} and below your range. A little lighter so you can hit ${lo}.`}:{w,r:lo,n:nSets,why:`Last: ${last_}. Same weight, aim for ${lo}+ reps.`}}
  if(hard)return {w,r:minR,n:nSets,why:`Last: ${last_}. Repeat it and make it feel smoother.`};
  if(top.length>=2&&maxR-minR<=1)return {w:w+step,r:minR,n:nSets,up:true,why:`Last: ${last_}. Every set landed, so go up!`};
  return {w,r:maxR,n:nSets,why:`Last: ${last_}. Match your best set on every set.`};
}

function workingW(e,last){const d=e.sets.map(s=>num(s.w)).filter(x=>x>0);if(d.length)return Math.max(...d);const s=smartFor(e,last);if(s&&s.w)return s.w;return null}
function warmupSets(W,e){const u=unit(),bar=u==='kg'?20:45,rnd=u==='kg'?2.5:5,R=x=>Math.round(x/rnd)*rnd;
  const barbell=/barbell|back squat|front squat|deadlift|bench press|overhead press|hip thrust|romanian|good morning|barbell row|pendlay/i.test(e.ex)&&!/dumbbell|db |cable|machine|kettlebell|smith|single/i.test(e.ex);

  try{const f=new File([blob],name,{type:mime});if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}

function compressImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{const M=900,sc=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.78,u=c.toDataURL('image/jpeg',q);while(u.length>330000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.src=fr.result};fr.readAsDataURL(file)})}

function topOn(ex,after){const ws=sortedAsc().filter(w=>w.date>after).reverse();for(const w of ws)for(const e of w.entries||[])if(e.ex===ex){const t=Math.max(0,...(e.sets||[]).map(s=>num(s.w)||0));if(t)return {w:t,date:w.date}}return null}

function recapStats(wk){const a=wk,z=iso(addDays(parse(wk),6)),inR=d=>d>=a&&d<=z;const ws=S.workouts.filter(w=>inR(w.date));

  const fav=Object.entries(exC).sort((x,y)=>y[1]-x[1])[0];const prs=computePRs().prs.filter(p=>inR(p.date));
  const cmin=Math.round(cardioRows().filter(x=>inR(x.date)).reduce((s,x)=>s+(x.t||0),0));const st=S.steps.filter(x=>inR(x.date)&&x.n);const rest=S.rest.filter(r=>inR(r.date)).length;
  const wg=[...Array(7)].filter((_,i)=>waterOf(iso(addDays(parse(wk),i)))>=S.profile.water.goal).length;

const normEx=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function tidyScan(){
  const sig=w=>w.date+'|'+JSON.stringify((w.entries||[]).map(e=>[e.ex,(e.sets||[]).map(s=>[s.r,s.w,s.t,s.d])]));
  const seen={},dups=[];for(const w of sortedAsc()){const k=sig(w);if(seen[k])dups.push(w);else seen[k]=1}
  let empty=0;const emptyW=new Set();for(const w of S.workouts)for(const e of w.entries||[]){const n=(e.sets||[]).filter(s=>!hasVal(s)).length;if(n||!(e.sets||[]).length){empty+=n||1;emptyW.add(w.id)}}
  const names={};for(const w of S.workouts)for(const e of w.entries||[]){const k=normEx(e.ex);(names[k]=names[k]||{})[e.ex]=((names[k]||{})[e.ex]||0)+1}
  const known=new Set(CATS.flatMap(c=>[...(DEFAULTS[c.key]||[]),...(S.profile.custom[c.key]||[])]));
  const merges=Object.values(names).filter(o=>Object.keys(o).length>1).map(o=>{const arr=Object.entries(o).sort((a,b)=>(known.has(b[0])-known.has(a[0]))||(b[1]-a[1]));return {to:arr[0][0],from:arr.slice(1).map(x=>x[0])}});
  const emptyRest=S.rest.filter(r=>!(r.acts||[]).length&&!r.feel&&!(r.note||'').trim());
  return {dups,empty,emptyW:[...emptyW],merges,emptyRest};
}
function renderTidy(){
  const r=tidyScan();S.modal='tidy';const ok=!r.dups.length&&!r.empty&&!r.merges.length&&!r.emptyRest.length;
  $('#modal').innerHTML=`<div class="ov" data-act="closeModal"><div class="sheet" data-stop="1" style="max-width:520px"><div class="sh-h"><h2>🧹 Data tidy-up</h2><button class="x" data-act="closeModal">✕</button></div>
  ${ok?'<div class="card empty"><h3>Sparkly clean ✨</h3>No duplicates, empty sets or mismatched names found.</div>':''}
  ${r.dups.length?`<div class="tidy"><div><b>${r.dups.length} duplicate workout${r.dups.length>1?'s':''}</b><span>${r.dups.slice(0,4).map(w=>fmtD(w.date)).join(', ')}${r.dups.length>4?'…':''}</span></div><button class="btn sm pri" data-act="tidyDups">Remove copies</button></div>`:''}
  ${r.empty?`<div class="tidy"><div><b>${r.empty} empty set${r.empty>1?'s':''}</b><span>in ${r.emptyW.length} workout${r.emptyW.length>1?'s':''}</span></div><button class="btn sm pri" data-act="tidyEmpty">Clean up</button></div>`:''}
  ${r.merges.map((m,i)=>`<div class="tidy"><div><b>Merge names</b><span>${m.from.map(esc).join(', ')} → <b>${esc(m.to)}</b></span></div><button class="btn sm pri" data-act="tidyMerge" data-i="${i}">Merge</button></div>`).join('')}
  ${r.emptyRest.length?`<div class="tidy"><div><b>${r.emptyRest.length} empty rest day${r.emptyRest.length>1?'s':''}</b><span>no activities, feeling or note</span></div><button class="btn sm pri" data-act="tidyRest">Remove</button></div>`:''}
  <div class="sub" style="margin-top:10px">Tip: make a backup first if you're unsure.</div></div></div>`;
  S.tidy=r;
}

/* ----- At a glance ----- */
function weekStreakNow(){

  let wk=weekStart(new Date());if((byWeek[iso(wk)]||0)<goal)wk=addDays(wk,-7);let n=0;
  for(let g=0;g<600;g++){const k=iso(wk);if((byWeek[k]||0)>=goal)n++;else if(!weekPaused(k))break;wk=addDays(wk,-7)}return n;
}
function stepStreakNow(){const goal=S.profile.goals.steps||8000,t=todayISO();let n=0;for(let d=new Date(),g=0;g<3650;g++,d=addDays(d,-1)){const k=iso(d),r=stepsOf(k);if(r&&r.n>=goal)n++;else if(k===t||isPausedDay(k))continue;else break}return n}
function todayFlower(){const t=todayISO(),ws=S.workouts.filter(w=>w.date===t);if(ws.length){const s=new Set(ws.map(w=>typeCls(w.type)));return s.size>1?'💐':s.has('Lower')?'🌷':s.has('Upper')?'🌻':s.has('Cardio')?'🌼':s.has('Full')?'🌺':'🌸'}if(S.rest.some(r=>r.date===t))return '🍀';return null}
function glanceRow(){
  if(!S.profile.extras.glance)return '';

  const ws=weekStreakNow();tile('data-act="tab" data-v="consistency"','🔥',ws,`week streak${activePause()?' · paused':''}`,null);

  if(X.levels){const {xp}=computeXP(),L=levelOf(xp);tile('data-act="openLevel"',L.icon,`Lv ${L.n}`,esc(L.name),(xp-L.from)/(L.to-L.from))}
  if(X.badges){const bs=computeBadges(),got=bs.filter(b=>b.earned).length,next=bs.filter(b=>!b.earned).sort((a,b)=>b.v/b.goal-a.v/a.goal)[0];
    tile('data-act="tab" data-v="consistency"',next?next.icon:'🏅',next?esc(next.prog):`${got}/${bs.length}`,next?`next badge: ${esc(next.name)}`:'all badges earned!',next?next.v/next.goal:1)}
  if(X.challenges){const a=S.profile.challenges.filter(j=>!j.closed).map(j=>chalStatus(j)).filter(Boolean)[0];

/* ----- Looseness ----- */
const LOOSE=[[1,'🪨','Stiff'],[2,'🥨','Tight'],[3,'🙂','Okay'],[4,'🌊','Loose'],[5,'🍝','Noodle']];
const looseOf=d=>S.loose.find(x=>x.date===d)?.v||0;
function dayActs(d){const out=[];for(const w of S.workouts.filter(w=>w.date===d))out.push(w.routine||w.type);const r=S.rest.find(r=>r.date===d);if(r)out.push(...((r.acts||[]).length?r.acts:['rest day']));return out}
function loosestDay(days){
  const L=S.loose.filter(x=>x.v&&(!days||x.date>=iso(addDays(new Date(),-(days-1))))).sort((a,b)=>b.v-a.v||(a.date<b.date?1:-1));
  return L[0]||null;
}
function looseCard(){
  if(!S.profile.extras.loose)return '';
  const t=todayISO(),v=looseOf(t),today=new Date();
  const days=[...Array(14)].map((_,i)=>iso(addDays(today,i-13)));
  const best=loosestDay(30),ever=loosestDay(0);
  const why=d=>{const a=[...new Set([...dayActs(d),...dayActs(iso(addDays(parse(d),-1))).map(x=>x)])];return a.length?a.slice(0,4).map(esc).join(', '):''};
  const logged=S.loose.filter(x=>x.date>=days[0]&&x.v);const avg=logged.length?logged.reduce((a,x)=>a+x.v,0)/logged.length:0;
  return `<div class="card loose-card"><div class="g-h" style="margin-bottom:8px"><h3>🧘 How loose do you feel today?</h3>${avg?`<span class="sub">2-week avg ${LOOSE[Math.round(avg)-1][1]} ${avg.toFixed(1)}</span>`:''}</div>
    <div class="loose-scale">${LOOSE.map(([n,e,l])=>`<button class="lz ${v===n?'on':''}" data-act="loose" data-v="${n}"><span>${e}</span>${l}</button>`).join('')}</div>
    <div class="loose-week">${days.map(d=>{const x=looseOf(d);return `<div title="${fmtD(d)}${x?': '+LOOSE[x-1][2]:''}" class="${d===t?'td':''} ${best&&d===best.date?'best':''}"><i style="height:${x?x*20:6}%;background:${x?(x>=4?T.up:x===3?COLORS.Full:COLORS.Lower):T.s3}"></i><span>${parse(d).toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`}).join('')}</div>
    ${best?`<div class="loosest">🏆 <b>Loosest day (30 days):</b> ${fmtD(best.date,{weekday:'short',month:'short',day:'numeric'})} · ${LOOSE[best.v-1][1]} ${LOOSE[best.v-1][2]}${why(best.date)?`<br><span class="sub">That day and the day before: ${why(best.date)}</span>`:''}</div>`:'<div class="sub" style="margin-top:8px">Check in each day to find what makes you feel loosest.</div>'}
    ${ever&&best&&ever.date!==best.date?`<div class="sub" style="margin-top:4px">All-time loosest: ${fmtD(ever.date,{month:'short',day:'numeric',year:'numeric'})} ${LOOSE[ever.v-1][1]}</div>`:''}</div>`;
}

function firstReached(ex,t){for(const w of sortedAsc())for(const e of w.entries||[])if(e.ex===ex)for(const s of e.sets||[]){const x=num(s.w);if(x!=null&&x>=t)return w.date}return null}

function startRoutine(r){
  const go=()=>{
    S.draft={id:null,date:todayISO(),type:r.type,notes:'',routine:r.name,entries:[]};

    S.draft.entries=r.items.map(it0=>{

      const tw=last?last.sets.map(s=>num(s.w)).filter(x=>x!=null):[];
      const w=tw.length?String(Math.max(...tw)):'';
      const n=Math.min(10,Math.max(1,parseInt(it.sets)||1));

    });

}
function routineFromWorkout(w,name){
  return {id:gid().replace(/^w/,'rt'),name,type:w.type||'Other',items:(w.entries||[]).map(e=>{
    const cardio=isCardioCat(e.cat);const sets=e.sets||[];
    if(cardio)return {cat:e.cat,ex:e.ex,sets:1,reps:summarize(sets),note:e.note||''};
    const cnt={};for(const s of sets){const r=num(s.r);if(r!=null)cnt[r]=(cnt[r]||0)+1}
    const reps=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
    return {cat:e.cat,ex:e.ex,sets:sets.length||3,reps:String(reps),note:e.note||'',...(e.ss?{ss:e.ss}:{})};

/* ----- Progress view ----- */
function seriesFor(ex){
  const rows=[];
  for(const w of sortedAsc()){
    const sets=[];for(const e of w.entries||[])if(e.ex===ex)sets.push(...(e.sets||[]));
    if(!sets.length)continue;
    let top=null,e1=null,vol=0,maxR=null;
    for(const s of sets){const r=num(s.r),wt=num(s.w);
      if(r!=null)maxR=Math.max(maxR??0,r);
      if(wt!=null){top=Math.max(top??-Infinity,wt);if(r!=null&&r>0){const est=r===1?wt:wt*(1+r/30);e1=Math.max(e1??0,est);vol+=r*wt}}}
    rows.push({date:w.date,wid:w.id,sets,top,e1,vol,maxR});
  }
  return rows;
}
function exerciseIndex(){
  const m=new Map();
  for(const w of S.workouts)for(const e of w.entries||[]){if(!(e.sets||[]).length||isCardioCat(e.cat))continue;const k=e.ex;const cur=m.get(k);if(!cur||w.date>cur.last)m.set(k,{ex:k,cat:e.cat,last:w.date})}
  return [...m.values()].sort((a,b)=>a.last<b.last?1:-1);
}
function computePRs(){
  const best={},prs=[],set=new Set();
  for(const w of sortedAsc())for(const e of w.entries||[]){
    let top=null;for(const s of e.sets||[]){const x=num(s.w);if(x!=null)top=Math.max(top??-Infinity,x)}
    if(top==null)continue;
    if(best[e.ex]!=null&&top>best[e.ex]){prs.push({date:w.date,ex:e.ex,top,prev:best[e.ex]});set.add(w.id+'|'+e.ex)}
    best[e.ex]=Math.max(best[e.ex]??-Infinity,top);
  }
  return {prs,set,best};
}

/* ----- charts ----- */
function niceTicks(lo,hi,n=4){
  if(lo===hi){lo-=1;hi+=1}
  const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag;
  const step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));
  return t;
}
function lineChart(pts,color,metric,low,goal){
  if(!pts.length)return `<div class="empty">No data for this metric yet.</div>`;
  const W=640,H=250,pl=46,pr=18,pt=16,pb=30;
  const xs=pts.map(p=>parse(p.d).getTime()),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const ticks=goal!=null?niceTicks(Math.min(...ys,goal),Math.max(...ys,goal)):niceTicks(Math.min(...ys),Math.max(...ys));
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=t=>x1===x0?(pl+(W-pl-pr)/2):pl+(t-x0)/(x1-x0)*(W-pl-pr);
  const Y=v=>pt+(1-(v-y0)/((y1-y0)||1))*(H-pt-pb);
  let g='';
  for(const t of ticks){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${T.line}" stroke-width="1"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="${T.dim}">${fmtV(t,metric)}</text>`}
  const xl=[0];if(pts.length>2)xl.push(Math.floor((pts.length-1)/2));if(pts.length>1)xl.push(pts.length-1);
  for(const i of xl){const anchor=i===0?'start':i===pts.length-1?'end':'middle';g+=`<text x="${X(xs[i])}" y="${H-8}" text-anchor="${pts.length===1?'middle':anchor}" font-size="11" fill="${T.dim}">${fmtD(pts[i].d)}</text>`}
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=pts.length>1?`${line}L${X(xs[xs.length-1])},${H-pb}L${X(xs[0])},${H-pb}Z`:'';
  const best=low?Math.min(...ys):Math.max(...ys);
  const sel=S.ptSel??pts.length-1;
  if(goal!=null)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="${T.acc}" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${W-pr}" y="${Y(goal)-6}" text-anchor="end" font-size="11" fill="${T.acc}">goal ${fmtV(goal,metric)}</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i===sel?6:4}" fill="${p.y===best?T.acc:color}" stroke="${T.s1}" stroke-width="2"/><circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="14" fill="transparent" data-act="pt" data-i="${i}" style="cursor:pointer"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${area?`<path d="${area}" fill="url(#ga)"/>`:''}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function spark(vals,color){
  if(vals.length<2)return `<svg width="84" height="28"></svg>`;
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const p=vals.map((v,i)=>`${i?'L':'M'}${(2+i/(vals.length-1)*80).toFixed(1)},${(24-(hi===lo?.5:(v-lo)/(hi-lo))*20).toFixed(1)}`).join('');
  return `<svg width="84" height="28" viewBox="0 0 84 28"><path d="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function heatmap(byDay,today){
  const weeks=22,cs=15,gap=3,left=26,top=18;
  const start=addDays(weekStart(today),-(weeks-1)*7);
  const W=left+weeks*(cs+gap),H=top+7*(cs+gap);
  let g='';let lastM=-1;
  for(let c=0;c<weeks;c++){
    const ws=addDays(start,c*7);
    if(ws.getMonth()!==lastM){lastM=ws.getMonth();g+=`<text x="${left+c*(cs+gap)}" y="11" font-size="10.5" fill="${T.dim}">${ws.toLocaleDateString(undefined,{month:'short'})}</text>`}
    for(let r=0;r<7;r++){
      const d=addDays(ws,r),k=iso(d),fut=d>today;
      const items=byDay[k];
      const fill=fut?'transparent':items?dayColor(items):restDays().has(k)?T.rest:isPausedDay(k)?'url(#pz)':T.s2;
      const sel=S.heatSel===k?' stroke="${T.tx}" stroke-width="1.5"':'';
      g+=`<rect x="${left+c*(cs+gap)}" y="${top+r*(cs+gap)}" width="${cs}" height="${cs}" rx="3.5" fill="${fill}"${fut?` stroke="${T.s2}"`:''}${sel} ${fut?'':`data-act="heat" data-d="${k}" style="cursor:pointer"`}/>`;
    }
  }
  ['M','','W','','F','',''].forEach((l,i)=>{if(l)g+=`<text x="0" y="${top+i*(cs+gap)+11}" font-size="10" fill="${T.dim}">${l}</text>`});
  g=`<defs><pattern id="pz" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="${T.s2}"/><rect width="2" height="4" fill="${T.dim}"/></pattern></defs>`+g;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,520)}px;max-width:${Math.round(W*1.45)}px">${g}</svg></div>`;
}
function heatReadout(k,byDay){

function stepBars(today){

  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;g+=`<rect x="${x}" y="${v?Y(v):H-pb-3}" width="${w}" height="${v?H-pb-Y(v):3}" rx="3" fill="${v>=goal?T.up:v?COLORS.Lower:T.s2}"/>`;if(i%2===1||i===n-1)g+=`<text x="${x+w/2}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="${T.dim}">${i===n-1?'today':parse(days[i]).toLocaleDateString(undefined,{weekday:'narrow'})+parse(days[i]).getDate()}</text>`});

function weekBars(byWeek,goal,today){

    if(i%3===0||i===n-1)g+=`<text x="${x+w/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="${T.dim}">${i===n-1?'now':fmtD(iso(addDays(start,i*7)))}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="${T.acc}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W}" y="${Y(goal)-4}" font-size="10" text-anchor="end" fill="${T.acc}">goal</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:${T.up}"></i>Goal met</span><span><i style="background:${T.under}"></i>Under goal</span></div>`;
}

    <div class="tile"><div class="k">Distance · 30 days</div><div class="v">${dist30?fw(dist30):'—'}<small>${dist30?dU():''}</small></div><div class="d">&nbsp;</div></div>

const CMET={t:['Time','min'],d:['Distance',null],c:['Calories','cal'],pace:['Pace',null]};
function cardioDetail(ex,rs){
  const avail=Object.keys(CMET).filter(k=>rs.some(r=>r[k]!=null));
  let m=avail.includes(S.cMetric)?S.cMetric:avail[0]||'t';
  const u=m==='d'?dU():m==='pace'?'min/'+dU():CMET[m][1];
  const pts=rs.filter(r=>r[m]!=null).map(r=>({d:r.date,y:r[m],r}));
  const vals=pts.map(p=>p.y);
  const best=vals.length?(m==='pace'?Math.min(...vals):Math.max(...vals)):null;
  const f=v=>m==='pace'?fmtPace(v):m==='c'?String(Math.round(v)):fw(v);
  const sel=S.ptSel??pts.length-1,p=pts[sel];
  const tot=rs.reduce((a,r)=>a+(r.t||0),0);
  let h=`<button class="back" data-act="cpick" data-ex=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>All cardio</button>
  <div class="view-title"><h2 style="font-size:22px">${esc(cap(ex))}</h2><span class="sub">${esc(CATMAP[rs[0].cat]?.name||'')}</span></div>
  <div class="seg" style="margin-bottom:14px">${avail.map(k=>`<button class="${m===k?'on':''}" data-act="cmetric" data-v="${k}">${CMET[k][0]}</button>`).join('')}</div>
  <div class="tiles">
    <div class="tile"><div class="k">Latest</div><div class="v">${vals.length?f(vals[vals.length-1]):'—'}<small>${esc(u)}</small></div><div class="d">${pts.length?fmtD(pts[pts.length-1].d):''}</div></div>
    <div class="tile"><div class="k">${m==='pace'?'Fastest':'Best'}</div><div class="v">${best!=null?f(best):'—'}<small>${esc(u)}</small></div><div class="d">${best!=null?fmtD(pts.find(x=>x.y===best).d):''}</div></div>
    <div class="tile"><div class="k">Sessions</div><div class="v">${rs.length}</div><div class="d">since ${fmtD(rs[0].date,{month:'short',day:'numeric',year:'numeric'})}</div></div>
    <div class="tile"><div class="k">Total time</div><div class="v">${tot>=120?fw(Math.round(tot/6)/10):fw(tot)}<small>${tot>=120?'hrs':'min'}</small></div><div class="d">&nbsp;</div></div>
  </div>
  <div class="card chart-wrap">${pts.length?lineChart(pts,COLORS.Cardio,m==='c'?'vol':'top',m==='pace'):''}<div class="readout">${p?`<b>${fmtD(p.d,{weekday:'short',month:'short',day:'numeric'})}</b> · ${f(p.y)} ${esc(u)} · ${esc(summarize(p.r.sets))}`:''}</div></div>
  ${m==='pace'?`<div class="sub" style="margin-top:8px">Pace = minutes per ${dU()}. Lower is faster.</div>`:''}
  <div class="card sec"><h3>Session log</h3><div class="list">${[...rs].reverse().map(r=>`<div class="row"><div class="nm"><b>${fmtD(r.date,{weekday:'short',month:'short',day:'numeric'})}</b><span>${esc(summarize(r.sets))}</span></div><div class="val">${r.t!=null?fw(r.t)+' min':''}<span>${r.pace?fmtPace(r.pace)+' /'+dU():''}</span></div></div>`).join('')}</div></div>`;
  return h;
}

let tTimer;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.add('hidden'),2800)}

/* ---------------- actions ---------------- */
function entryOf(el){const id=el.closest('.entry')?.dataset.eid;return S.draft.entries.find(e=>e.id===id)}
function addExercise(cat,ex){
  const has=S.draft.entries.find(e=>e.ex===ex);
  if(has){const el=document.querySelector(`[data-eid="${has.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'});return}
  const last=lastFor(ex);
  const sets=last?toDraftSets(last.sets):[];
  const e={id:gid(),cat,ex,sets:sets.length?[{...sets[0]}]:[blankSet(cat)],note:''};
  S.draft.entries.push(e);persistDraft();render();
  const el=document.querySelector(`[data-eid="${e.id}"] input[data-f="r"]`);el&&el.focus({preventScroll:false});
}
function addCustom(cat,name){
  name=name.trim().replace(/\s+/g,' ');if(!name)return null;
  const low=name.toLowerCase();
  for(const c of CATS){const hit=[...DEFAULTS[c.key],...(S.profile.custom[c.key]||[])].find(e=>e.toLowerCase()===low);if(hit){
    const k=c.key+'|'+hit;if(S.profile.hidden.includes(k)){S.profile.hidden=S.profile.hidden.filter(x=>x!==k);Store.saveProfile()}
    return {cat:c.key,ex:hit}}}
  (S.profile.custom[cat]=S.profile.custom[cat]||[]).push(low===name.toLowerCase()?name.toLowerCase():name);
  Store.saveProfile();return {cat,ex:name.toLowerCase()};
}
async function saveWorkout(){
  const d=S.draft;
  const entries=d.entries.map(e=>({cat:e.cat,ex:e.ex,note:(e.note||'').trim(),...(e.ss?{ss:e.ss}:{}),sets:e.sets.map(s=>isCardioCat(e.cat)?{t:num(s.t),d:num(s.d),c:num(s.c),l:String(s.l||'').trim()}:({r:num(s.r),w:num(s.w),...(+s.e?{e:+s.e}:{})})).filter(hasVal).filter(s=>!e.target||isCardioCat(e.cat)||s.r!=null)})).filter(e=>e.sets.length||e.note);
  if(!entries.length){toast('Add at least one set first');return}
  const id=d.id||gid();
  const old=S.workouts.find(w=>w.id===id);
  const doc={date:d.date,type:d.type,notes:(d.notes||'').trim(),entries,...(d.rating?{rating:d.rating}:{}),...((d.tags||[]).length?{tags:d.tags}:{}),...(d.loc?{loc:d.loc}:{}),...(d.routine?{routine:d.routine}:{}),createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};
  // PR check
  const prev={};for(const w of S.workouts){if(w.id===id||w.date>d.date)continue;for(const e of w.entries||[])for(const s of e.sets||[]){const x=num(s.w);if(x!=null)prev[e.ex]=Math.max(prev[e.ex]??-Infinity,x)}}
  const prs=[];for(const e of entries){const t=Math.max(...e.sets.map(s=>s.w??-Infinity));if(isFinite(t)&&prev[e.ex]!=null&&t>prev[e.ex])prs.push(`${cap(e.ex)} ${fw(t)} ${unit()}`)}
  const cbGap=!old?gapBefore(d.date):null,cbRest=!old?restRun():0,firstToday=!old&&d.date===todayISO()&&!S.workouts.some(w=>w.date===d.date);
  const btn=document.querySelector('[data-act="saveWorkout"]');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{
    await Store.saveWorkout(id,doc);if(doc.loc&&doc.loc!==S.profile.lastLoc){S.profile.lastLoc=doc.loc;Store.saveProfile()}
    S.draft=newDraft();setOpenForType(S.draft.type);persistDraft();
    toast(prs.length?`🏆 New PR: ${prs.join(', ')}`:(old?'Workout updated':'Workout saved ✓'));
    const wkN=S.workouts.filter(w=>iso(weekStart(parse(w.date)))===iso(weekStart(new Date()))).length;
    if(!old&&iso(weekStart(parse(doc.date)))===iso(weekStart(new Date()))&&wkN===(S.profile.goal||3)){setTimeout(()=>toast('🎉 Weekly goal hit!'),1600);celebrate()}
    else if(prs.length)celebrate();
    checkBadges();checkLevel();if(S.profile.extras.pump)setTimeout(()=>showPump(doc),prs.length?900:300);
    checkEarnThemes(5200);
    const cb=S.profile.extras.comeback&&((cbGap!=null&&cbGap>=7)||cbRest>=3);
    if(cb)setTimeout(()=>{popEgg({e:'💪',title:'Welcome back!',sub:cbGap!=null&&cbGap>=7?`First workout in ${cbGap} days. Comebacks are always stronger.`:`Back at it after ${cbRest} rest days. Fully recharged!`,rain:['🌺','💪','✨','🌱'],n:22,ms:3000});celebrate(.8)},S.profile.extras.pump?2600:900);
    if(firstToday&&S.profile.extras.games)setTimeout(()=>toast('🎮 Today\'s mini games are unlocked on Today!'),cb?4200:3200);
    setTimeout(()=>afterSaveEggs(doc,id),(S.profile.extras.pump?2600:900)+(cb?3400:0));
    window.scrollTo({top:0});render();
  }catch(e){toast(errMsg(e));if(btn){btn.disabled=false;btn.textContent='Save workout'}}
}
function startEdit(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return;
  const go=()=>{
    S.draft={id:w.id,date:w.date,type:w.type||'Other',notes:w.notes||'',routine:w.routine||'',rating:w.rating||0,tags:[...(w.tags||[])],loc:w.loc||'',entries:(w.entries||[]).map(e=>({id:gid(),cat:e.cat,ex:e.ex,note:e.note||'',ss:e.ss||'',sets:(e.sets||[]).map(s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v==null?'':String(v)])))}))};
